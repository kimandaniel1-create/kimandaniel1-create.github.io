media:
  input: media
  output: /media
content:
  - name: posts
    label: Articles
    type: file
    path: posts.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: Put *stars* around words to show them in italics, or **two stars** for bold. For example, The *light* in a dark room.
      - name: deck
        label: Summary
        type: text
        description: One or two sentences shown under the title and on article cards. The same marks work here as in the title, for example *italic*, **bold** and ==highlight==.
      - name: topic
        label: Topic
        type: string
        required: true
        description: Spell it the same way every time, for example Photography. Articles with the same topic are grouped together. To show a topic in italics, write it once with stars under Site settings, in Topic descriptions. That version is then used everywhere.
      - name: tags
        label: Tags
        type: string
        list: true
        description: Optional. Short lowercase words such as typography or performance. Spell each one the same way every time. Every tag gets its own page and is included in search.
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updated
        label: Last updated
        type: date
        options:
          format: yyyy-MM-dd
        description: Optional. Set it when you revise an article. The page then shows "Updated" with this date. It is ignored if it is not later than the publish date.
      - name: featured
        label: Featured
        type: boolean
        default: false
        description: Turn on to show this article at the top of the front page. If several are on, the newest one is used. If none are on, the newest article is shown.
      - name: image
        label: Cover image
        type: image
        description: Optional. Shown on the article, in the image slider and on article cards. Leave empty to use the generated dot-field cover.
      - name: image_alt
        label: Cover image description
        type: string
        description: A few words describing the picture, for screen readers. Leave empty if the picture is purely decorative.
      - name: body
        label: Article
        type: text
        description: |-
          Leave a blank line between paragraphs.
          Headings: start a line with ## (or ### for a smaller one). Pull quote: start a line with >. Divider: a line with only ---.
          Bullets: start each line with - . Numbered list: start each line with 1. 2. 3. and each number shows as you type it. A single numbered line with paragraphs under it becomes a large step heading, so 1. then 2. then 3. down the article gives numbered steps. Indent a line by two spaces to make a sub-list.
          Text: *italic*, **bold**, ***bold italic***, ++underline++, ~~strikethrough~~, ==highlight==, x^2^ for superscript, H~2~O for subscript, `code`. Put a backslash before a symbol to show it as it is, for example \*.
          Link: [the words](https://example.com).
          Note box: write > [!NOTE], > [!TIP] or > [!WARNING] on its own line, then the text on the lines below, each starting with > .
          Code: a line with three backticks, then the code, then a line with three backticks.
          Photo: upload it in the Media section, then write ![What it shows](/media/photo.jpg) on its own line. To add a caption, put it in quotes after the address: ![What it shows](/media/photo.jpg "Your caption"). For several photos, use the Image gallery below instead.
      - name: gallery
        label: Image gallery
        type: object
        list: true
        description: Optional. Add pictures one at a time. They appear together inside the article, as a slider by default. Drag the items to change their order. With one picture, it is shown as a single image.
        fields:
          - name: image
            label: Image
            type: image
          - name: alt
            label: Description
            type: string
            description: A few words describing the picture, for screen readers. Also searchable.
          - name: caption
            label: Caption
            type: string
            description: Optional. Shown in small type under the picture.
      - name: gallery_title
        label: Gallery heading
        type: string
        description: Optional. A small label above the gallery, for example Selected frames. Leave empty for none.
      - name: gallery_layout
        label: Gallery style
        type: select
        default: slider
        description: How the pictures are arranged.
        options:
          values:
            - value: slider
              label: Slider (one picture at a time, swipe or use the arrows)
            - value: grid
              label: Grid (two pictures per row)
            - value: stack
              label: Stacked (one under another)
      - name: gallery_ratio
        label: Picture shape
        type: select
        default: 16-10
        description: The shape of each picture frame. Original keeps every picture's own shape, so it suits pictures that are all the same shape.
        options:
          values:
            - value: 16-10
              label: Wide (16:10)
            - value: 4-3
              label: Standard (4:3)
            - value: 1-1
              label: Square (1:1)
            - value: 3-4
              label: Portrait (3:4)
            - value: auto
              label: Original (no cropping)
      - name: gallery_fit
        label: Picture fit
        type: select
        default: cover
        description: Fill crops the edges so the picture fills the frame. Whole picture shows all of it, with dark bars where the shapes differ.
        options:
          values:
            - value: cover
              label: Fill the frame
            - value: contain
              label: Show the whole picture
      - name: gallery_position
        label: Gallery position
        type: select
        default: after-intro
        description: Where the gallery appears in the article.
        options:
          values:
            - value: before
              label: Above the text
            - value: after-intro
              label: After the first paragraph
            - value: end
              label: At the end of the text
      - name: sources
        label: Sources
        type: object
        list: true
        description: Optional. References shown in a numbered list at the end of the article. Add a link when there is one, and leave it empty for a book or report.
        fields:
          - name: title
            label: Title
            type: string
            description: For example "WCAG 2.2, Understanding SC 1.4.3 Contrast (Minimum)".
          - name: url
            label: Link
            type: string
            description: Optional. A full address starting with https://
      - name: draft
        label: Draft
        type: boolean
        default: false
        description: Turn on to keep this article off the site until it is ready.
      - name: author
        label: Author
        type: string
        description: Leave empty to use the editor name from Site settings.
      - name: slug
        label: Link name
        type: string
        description: Leave empty to build the link from the title. Use lowercase letters, numbers and hyphens.
        pattern:
          regex: '^$|^[a-z0-9]+(-[a-z0-9]+)*$'
          message: Use only lowercase letters, numbers and single hyphens, for example the-one-light.
  - name: site
    label: Site settings
    type: file
    path: site.json
    format: json
    fields:
      - name: name
        label: Site name
        type: string
      - name: tagline
        label: Tagline
        type: string
        description: Shown in the footer.
      - name: editor_name
        label: Your name
        type: string
      - name: editor_role
        label: Your role
        type: string
      - name: editor_bio
        label: Short bio
        type: text
      - name: email
        label: Contact email
        type: string
      - name: social
        label: Social links
        type: object
        list: true
        description: Optional. Shown in the footer and on the About page. Leave the list empty to hide them.
        fields:
          - name: label
            label: Name
            type: string
            description: For example GitHub or LinkedIn.
          - name: url
            label: Link
            type: string
            description: A full address starting with https://
      - name: about_title
        label: About page headline
        type: string
        description: The text marks work here, for example *italic* or **bold**. They also work in the introduction, the Contact message, the newsletter headline and description, the Short bio, Topic descriptions and the About page points.
      - name: about_intro
        label: About page introduction
        type: text
      - name: contact_text
        label: Contact message
        type: text
      - name: newsletter_name
        label: Newsletter name
        type: string
      - name: newsletter_heading
        label: Newsletter headline
        type: string
      - name: newsletter_text
        label: Newsletter description
        type: text
      - name: newsletter_form
        label: Kit form address
        type: text
        description: >-
          From Kit, open your form, click Embed, choose HTML and copy it. Paste the
          whole thing here, or only the address after action=, which looks like
          https://app.kit.com/forms/1234567/subscriptions. Leave empty to hide
          the sign-up form and the Subscribe link.
      - name: newsletter_thanks_title
        label: Thank-you headline
        type: string
        description: Optional. Shown in place of the form after someone joins. Leave empty to use "Thank you for subscribing."
      - name: newsletter_thanks_text
        label: Thank-you message
        type: text
        description: Optional. Shown under the headline right after someone joins. Leave empty to use the default, which asks them to check their inbox for the confirmation email.
      - name: topics
        label: Topic descriptions
        type: object
        list: true
        description: Optional. Add a short description under each topic name on the front page.
        fields:
          - name: name
            label: Topic name
            type: string
            description: Spell it exactly as on your articles. Add stars to show it in italics everywhere, for example *Craft*.
          - name: blurb
            label: Description
            type: text
      - name: principles
        label: About page points
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
          - name: text
            label: Text
            type: text
