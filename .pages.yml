media:
  input: media
  output: /media
content:
  - name: posts
    label: Articles
    type: file
    path: posts.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: deck
        label: Summary
        type: text
        description: One or two sentences shown under the title and on article cards.
      - name: topic
        label: Topic
        type: string
        description: Spell it the same way every time, for example Photography. Articles with the same topic are grouped together.
      - name: tags
        label: Tags
        type: string
        list: true
        description: Optional. Short lowercase words such as typography or performance. Spell each one the same way every time. Every tag gets its own page and is included in search.
      - name: date
        label: Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: updated
        label: Last updated
        type: date
        options:
          format: yyyy-MM-dd
        description: Optional. Set it when you revise an article. The page then shows "Updated" with this date. It is ignored if it is not later than the publish date.
      - name: featured
        label: Featured
        type: boolean
        default: false
        description: Turn on to show this article at the top of the front page. If several are on, the newest one is used. If none are on, the newest article is shown.
      - name: image
        label: Cover image
        type: image
        description: Optional. Shown on the article, in the image slider and on article cards. Leave empty to use the generated dot-field cover.
      - name: image_alt
        label: Cover image description
        type: string
        description: A few words describing the picture, for screen readers. Leave empty if the picture is purely decorative.
      - name: body
        label: Article
        type: text
        description: >-
          Leave a blank line between paragraphs. Start a line with ## for a
          heading, > for a pull quote, or - for a bullet. To add a photo,
          upload it in the Media section, then write ![What it shows](/media/photo.jpg)
          on its own line.
      - name: sources
        label: Sources
        type: object
        list: true
        description: Optional. References shown in a numbered list at the end of the article. Add a link when there is one, and leave it empty for a book or report.
        fields:
          - name: title
            label: Title
            type: string
            description: For example "WCAG 2.2, Understanding SC 1.4.3 Contrast (Minimum)".
          - name: url
            label: Link
            type: string
            description: Optional. A full address starting with https://
      - name: draft
        label: Draft
        type: boolean
        default: false
        description: Turn on to keep this article off the site until it is ready.
      - name: author
        label: Author
        type: string
        description: Leave empty to use the editor name from Site settings.
      - name: slug
        label: Link name
        type: string
        description: Leave empty to build the link from the title. Use lowercase letters and hyphens.
  - name: site
    label: Site settings
    type: file
    path: site.json
    format: json
    fields:
      - name: name
        label: Site name
        type: string
      - name: tagline
        label: Tagline
        type: string
        description: Shown in the footer.
      - name: editor_name
        label: Your name
        type: string
      - name: editor_role
        label: Your role
        type: string
      - name: editor_bio
        label: Short bio
        type: text
      - name: email
        label: Contact email
        type: string
      - name: social
        label: Social links
        type: object
        list: true
        description: Optional. Shown in the footer and on the About page. Leave the list empty to hide them.
        fields:
          - name: label
            label: Name
            type: string
            description: For example GitHub or LinkedIn.
          - name: url
            label: Link
            type: string
            description: A full address starting with https://
      - name: about_title
        label: About page headline
        type: string
      - name: about_intro
        label: About page introduction
        type: text
      - name: contact_text
        label: Contact message
        type: text
      - name: newsletter_name
        label: Newsletter name
        type: string
      - name: newsletter_heading
        label: Newsletter headline
        type: string
      - name: newsletter_text
        label: Newsletter description
        type: text
      - name: newsletter_username
        label: Buttondown username
        type: string
        description: Your username from buttondown.com. Leave empty to hide the sign-up form and the Subscribe link.
      - name: topics
        label: Topic descriptions
        type: object
        list: true
        description: Optional. Add a short description under each topic name on the front page.
        fields:
          - name: name
            label: Topic name
            type: string
          - name: blurb
            label: Description
            type: text
      - name: principles
        label: About page points
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
          - name: text
            label: Text
            type: text
