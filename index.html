<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Low Light is a journal about making things for the web, edited by Adeniyi Daniel.">
<meta name="theme-color" content="#0b0c10">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Low Light</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap">
<style>
/* Layout concept: a left-aligned editorial grid on a blue-leaning near-black ground.
   One live moment, a dot field lit by a lamp that follows the pointer. Everything else stays quiet. */
:root {
  --bg: #0b0c10;
  --bg-raise: #111319;
  --bg-sunk: #08090c;
  --line: #22252e;
  --line-strong: #343847;
  --fg: #e8e9ee;
  --fg-soft: #c3c6d1;
  --muted: #8a8fa0;
  --accent: #e9b96e;
  --accent-hi: #f2c985;
  --accent-ink: #1b1206;
  --accent-wash: rgba(233, 185, 110, 0.12);
  --danger: #f08c80;

  --font-display: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
  --font-text: 'Newsreader', Georgia, 'Times New Roman', serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

  --step-2: 1.375rem;
  --step-3: clamp(1.65rem, 1.25rem + 1.8vw, 2.25rem);
  --step-4: clamp(2.3rem, 1.4rem + 4.2vw, 4.25rem);

  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: 5.5rem; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 1rem/1.55 var(--font-display);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 30;
}
a { color: inherit; }
button, input { font: inherit; color: inherit; }
img, svg { max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
main { display: block; }
main h1:focus { outline: none; }
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip {
  position: absolute; left: 1rem; top: -4rem; z-index: 40;
  padding: .6rem 1rem; border-radius: 10px; border: 1px solid var(--accent);
  background: var(--bg); color: var(--fg); cursor: pointer;
}
.skip:focus { top: calc(env(safe-area-inset-top, 0px) + .75rem); }

.wrap {
  width: 100%;
  max-width: 1240px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Header */
.site-head {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: rgba(11, 12, 16, 0.9);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.head-row { display: flex; align-items: center; flex-wrap: wrap; gap: .25rem 1.5rem; min-height: 3.5rem; }
.brand { display: inline-flex; align-items: center; gap: .6rem; text-decoration: none; font-weight: 700; font-size: 1.125rem; letter-spacing: -.02em; }
.brand .ring { fill: none; stroke: var(--line-strong); }
.brand .halo { fill: var(--accent); fill-opacity: .22; }
.brand .core { fill: var(--accent); }
.nav { display: flex; gap: 1.25rem; margin-right: auto; }
.nav a { text-decoration: none; color: var(--muted); font-size: .9375rem; padding: .35rem 0; border-bottom: 2px solid transparent; }
.nav a:hover { color: var(--fg); }
.nav a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }
.head-actions { display: flex; align-items: center; gap: .5rem; }
.icon-btn { width: 2.5rem; height: 2.5rem; display: grid; place-items: center; border: 0; background: transparent; border-radius: 8px; color: var(--fg-soft); cursor: pointer; }
.icon-btn:hover { color: var(--accent); }
.pill { padding: .4rem .95rem; border: 1px solid var(--line-strong); border-radius: 999px; font-size: .875rem; font-weight: 500; text-decoration: none; }
.pill:hover { border-color: var(--accent); color: var(--accent); }
.progress { height: 2px; }
.progress span { display: block; height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); }
@media (max-width: 560px) {
  .head-row { padding-top: .25rem; }
  .brand { margin-right: auto; }
  .head-actions { order: 2; }
  .nav { order: 3; flex-basis: 100%; padding-bottom: .4rem; }
}

/* Shared type and parts */
.kicker { font-family: var(--font-mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.kicker b { color: var(--accent); font-weight: 500; }
.meta { display: flex; flex-wrap: wrap; gap: .2rem .9rem; font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }
.meta .tag { color: var(--accent); }
.h-section { font-size: var(--step-3); font-weight: 650; letter-spacing: -.02em; line-height: 1.1; margin: 0; text-wrap: balance; }
.h-page { font-size: var(--step-4); font-weight: 700; letter-spacing: -.03em; line-height: 1.04; margin: .5rem 0 1.1rem; max-width: 20ch; text-wrap: balance; }
.lede { font-family: var(--font-text); font-size: 1.3rem; line-height: 1.5; color: var(--fg-soft); max-width: 46ch; margin: 0; }
.band { padding-block: clamp(2.5rem, 6vw, 5rem); }
.band-line { border-top: 1px solid var(--line); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1.75rem; flex-wrap: wrap; }
.more { color: var(--accent); text-decoration: none; font-size: .9375rem; font-weight: 500; display: inline-flex; gap: .4rem; align-items: center; }
.more:hover { color: var(--accent-hi); }
.more svg { transition: transform .15s; }
.more:hover svg { transform: translateX(3px); }

.btn {
  display: inline-flex; align-items: center; gap: .55rem;
  padding: .72rem 1.15rem; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  border-radius: 10px; font-weight: 600; font-size: .9375rem; text-decoration: none; cursor: pointer;
  transition: background .15s, border-color .15s, color .15s;
}
.btn:hover { background: var(--accent-hi); border-color: var(--accent-hi); }
.btn svg { transition: transform .15s; }
.btn:hover svg { transform: translateX(3px); }
.btn-ghost { background: transparent; color: var(--fg); border-color: var(--line-strong); }
.btn-ghost:hover { background: transparent; border-color: var(--accent); color: var(--accent); }
.btn-small { padding: .35rem .75rem; font-size: .8125rem; }

/* Cover art */
.thumb { aspect-ratio: 16 / 10; max-width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-sunk); color: var(--accent); overflow: hidden; transition: border-color .2s; }
.thumb svg, .hero-visual svg { display: block; width: 100%; height: 100%; }
.cover { transition: transform .5s ease; }

/* Hero */
.hero { padding-block: clamp(2rem, 5vw, 4rem) clamp(2.5rem, 6vw, 5rem); }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: clamp(1.5rem, 4vw, 4rem); align-items: center; }
.hero-copy { display: flex; flex-direction: column; gap: 1.1rem; align-items: flex-start; min-width: 0; }
.hero-title { font-size: var(--step-4); font-weight: 700; letter-spacing: -.035em; line-height: 1.02; margin: 0; text-wrap: balance; }
.hero-title a { text-decoration: none; }
.hero-title a:hover { color: var(--accent); }
.hero-deck { font-family: var(--font-text); font-size: 1.3rem; line-height: 1.5; color: var(--fg-soft); margin: 0; max-width: 40ch; }
.hero-visual {
  position: relative; aspect-ratio: 36 / 22; max-width: 100%;
  border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  background: radial-gradient(120% 90% at 30% 40%, rgba(233, 185, 110, 0.06), transparent 60%), var(--bg-sunk);
  color: var(--accent); touch-action: pan-y; cursor: crosshair;
}
.hint { position: absolute; left: .9rem; bottom: .7rem; font: 500 .72rem var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); pointer-events: none; }
@media (max-width: 900px) { .hero-grid { grid-template-columns: minmax(0, 1fr); } }

/* Topics */
.topics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.topic { display: flex; flex-direction: column; gap: .5rem; padding: 1.25rem 1.5rem 1.75rem 0; border-top: 1px solid var(--line-strong); text-decoration: none; }
.topic .count { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }
.topic h3 { margin: 0; font-size: 1.5rem; letter-spacing: -.02em; font-weight: 650; }
.topic p { margin: 0; color: var(--fg-soft); font-family: var(--font-text); font-size: 1.0625rem; line-height: 1.45; }
.topic:hover h3 { color: var(--accent); }
@media (max-width: 900px) { .topics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .topics { grid-template-columns: minmax(0, 1fr); } }

/* Cards and rows */
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.75rem 2rem; }
@media (max-width: 700px) { .grid-2 { grid-template-columns: minmax(0, 1fr); } }
.card { display: flex; flex-direction: column; gap: .85rem; text-decoration: none; min-width: 0; }
.card h3 { margin: 0; font-size: var(--step-2); line-height: 1.2; letter-spacing: -.015em; font-weight: 650; text-wrap: balance; }
.card p { margin: 0; color: var(--fg-soft); font-family: var(--font-text); font-size: 1.0625rem; line-height: 1.5; }
.card:hover h3, .row:hover h3 { color: var(--accent); }
.card:hover .thumb, .row:hover .thumb { border-color: var(--line-strong); }
.card:hover .cover, .row:hover .cover { transform: scale(1.04); }

.row { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: 1.25rem 1.75rem; padding-block: 1.5rem; border-top: 1px solid var(--line); text-decoration: none; align-items: start; }
.row:last-child { border-bottom: 1px solid var(--line); }
.row-body { display: flex; flex-direction: column; gap: .5rem; min-width: 0; }
.row h3 { margin: 0; font-size: 1.5rem; line-height: 1.2; letter-spacing: -.02em; font-weight: 650; text-wrap: balance; }
.row p { margin: 0; color: var(--fg-soft); font-family: var(--font-text); font-size: 1.0625rem; line-height: 1.5; max-width: 60ch; }
.row .thumb { aspect-ratio: 4 / 3; }
@media (max-width: 560px) {
  .row { grid-template-columns: 6.5rem minmax(0, 1fr); gap: 1rem; }
  .row .thumb { aspect-ratio: 1 / 1; }
  .row h3 { font-size: 1.2rem; }
  .row p { display: none; }
}

/* Journal tools */
.page-head { padding-block: clamp(2.5rem, 6vw, 4.5rem) 1.5rem; }
.tools { display: flex; flex-direction: column; gap: 1rem; margin-block: 2rem 1.5rem; }
.search { position: relative; display: block; max-width: 26rem; }
.search svg { position: absolute; left: .9rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { width: 100%; padding: .75rem 1rem .75rem 2.6rem; background: var(--bg-raise); border: 1px solid var(--line-strong); border-radius: 10px; }
.search input::placeholder { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; }
.chip { padding: .4rem .9rem; border: 1px solid var(--line-strong); border-radius: 999px; font-size: .875rem; text-decoration: none; color: var(--fg-soft); }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip[aria-current="page"] { background: var(--accent-wash); border-color: var(--accent); color: var(--accent); }
.count-line { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); margin: 0 0 1rem; }
.empty { border: 1px dashed var(--line-strong); border-radius: 10px; padding: clamp(1.5rem, 4vw, 2.5rem); max-width: 38rem; }
.empty h3 { margin: 0 0 .5rem; font-size: 1.5rem; letter-spacing: -.02em; }
.empty p { margin: 0 0 1.25rem; color: var(--fg-soft); font-family: var(--font-text); font-size: 1.125rem; line-height: 1.5; }
.empty strong { color: var(--fg); font-weight: 500; overflow-wrap: anywhere; }

/* Post */
.post-head { padding-block: clamp(1.5rem, 4vw, 3rem) 1.75rem; display: flex; flex-direction: column; gap: 1.25rem; align-items: flex-start; }
.crumbs { display: flex; flex-wrap: wrap; gap: .6rem; font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }
.crumbs a { text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.post-title { font-size: var(--step-4); font-weight: 700; letter-spacing: -.035em; line-height: 1.03; margin: 0; max-width: 18ch; text-wrap: balance; }
.post-deck { font-family: var(--font-text); font-size: 1.4rem; line-height: 1.45; color: var(--fg-soft); margin: 0; max-width: 40ch; }
.byline { display: flex; align-items: center; gap: .85rem 1.25rem; flex-wrap: wrap; }
.by-who { display: flex; align-items: center; gap: .8rem; }
.by-name { font-weight: 600; line-height: 1.2; }
.avatar { flex: none; width: 2.5rem; height: 2.5rem; border-radius: 50%; display: grid; place-items: center; background: var(--accent-wash); color: var(--accent); font: 500 .8rem var(--font-mono); border: 1px solid rgba(233, 185, 110, 0.3); }
.post-cover { aspect-ratio: 21 / 8; border-radius: 14px; }
@media (max-width: 700px) { .post-cover { aspect-ratio: 16 / 10; } }
.post-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 3rem; padding-block: 2.5rem 3rem; }
@media (min-width: 1080px) { .post-grid { grid-template-columns: 13rem minmax(0, 65ch); gap: 4rem; } }
.toc { display: none; }
@media (min-width: 1080px) {
  .toc { display: block; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 5.5rem); align-self: start; }
}
.toc .kicker { margin-bottom: .75rem; }
.toc button { display: block; width: 100%; text-align: left; background: none; border: 0; border-left: 1px solid var(--line); padding: .45rem 0 .45rem .9rem; color: var(--muted); font-size: .875rem; line-height: 1.35; cursor: pointer; }
.toc button:hover { color: var(--fg); }
.toc button.on { color: var(--fg); border-left-color: var(--accent); }

.prose { font-family: var(--font-text); font-size: 1.1875rem; line-height: 1.7; color: var(--fg-soft); font-optical-sizing: auto; }
.prose p { margin: 0 0 1.4em; }
.prose > p:first-child { font-size: 1.3125rem; line-height: 1.6; color: var(--fg); }
.prose h2 { font-family: var(--font-display); font-size: 1.625rem; font-weight: 650; letter-spacing: -.02em; line-height: 1.2; color: var(--fg); margin: 2.4em 0 .7em; text-wrap: balance; }
.prose em { color: var(--fg); }
.prose code { font-family: var(--font-mono); font-size: .8em; background: var(--bg-raise); border: 1px solid var(--line); padding: .1em .38em; border-radius: 5px; color: var(--fg); overflow-wrap: anywhere; }
.prose blockquote { margin: 2.2em 0; padding: 1.3em 0; border-block: 1px solid var(--line-strong); }
.prose blockquote p { margin: 0; font-family: var(--font-display); font-size: clamp(1.4rem, 1.1rem + 1.4vw, 1.9rem); line-height: 1.25; letter-spacing: -.02em; font-weight: 600; color: var(--fg); text-wrap: balance; }
.code { margin: 1.8em 0; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-sunk); overflow: hidden; }
.code figcaption { display: flex; justify-content: space-between; align-items: center; padding: .45rem .5rem .45rem 1rem; border-bottom: 1px solid var(--line); font: 500 .72rem var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.code pre { margin: 0; padding: 1rem; overflow-x: auto; font: 400 .875rem/1.65 var(--font-mono); color: var(--fg); tab-size: 2; }
.code pre code { background: none; border: 0; padding: 0; font-size: inherit; color: inherit; }
.copy { background: transparent; border: 1px solid var(--line-strong); color: var(--fg-soft); border-radius: 6px; padding: .25rem .6rem; font: 500 .72rem var(--font-mono); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
.copy:hover { border-color: var(--accent); color: var(--accent); }

.share { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; padding-block: 1.25rem; border-top: 1px solid var(--line); }
.author-box { display: flex; gap: 1rem; align-items: flex-start; padding-block: 1.5rem; border-top: 1px solid var(--line); }
.author-box p { margin: .25rem 0 0; color: var(--fg-soft); font-family: var(--font-text); font-size: 1.0625rem; line-height: 1.5; }
.pn { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; padding-top: 1.5rem; border-top: 1px solid var(--line); }
.pn a { display: flex; flex-direction: column; gap: .35rem; text-decoration: none; min-width: 0; }
.pn a:last-child { text-align: right; align-items: flex-end; }
.pn strong { font-size: 1.0625rem; font-weight: 600; line-height: 1.3; text-wrap: balance; }
.pn a:hover strong { color: var(--accent); }
@media (max-width: 560px) { .pn { grid-template-columns: minmax(0, 1fr); } .pn a:last-child { text-align: left; align-items: flex-start; } }

/* About */
.principles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2rem; }
.principles > div { border-top: 1px solid var(--line-strong); padding-top: 1rem; }
.principles h3 { margin: 0 0 .5rem; font-size: 1.25rem; letter-spacing: -.015em; }
.principles p { margin: 0; color: var(--fg-soft); font-family: var(--font-text); font-size: 1.0625rem; line-height: 1.5; }
@media (max-width: 800px) { .principles { grid-template-columns: minmax(0, 1fr); } }
.people { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 28rem)); gap: 2rem; }
.person { display: flex; flex-direction: column; gap: .75rem; align-items: flex-start; }
.person h3 { margin: 0; font-size: 1.25rem; letter-spacing: -.015em; }
.person p { margin: 0; color: var(--fg-soft); font-family: var(--font-text); font-size: 1.0625rem; line-height: 1.5; }
@media (max-width: 800px) { .people { grid-template-columns: minmax(0, 1fr); } }
.mail { display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; margin-top: 1.25rem; }
.mail code { font: 500 1rem var(--font-mono); color: var(--fg); overflow-wrap: anywhere; user-select: all; }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 1.5rem 4rem; }
@media (max-width: 800px) { .two-col { grid-template-columns: minmax(0, 1fr); } }
.two-col .body p { margin: 0 0 1rem; font-family: var(--font-text); font-size: 1.1875rem; line-height: 1.6; color: var(--fg-soft); max-width: 60ch; }

/* Newsletter */
.band-news { background: var(--bg-sunk); border-block: 1px solid var(--line); }
.news-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 28rem); gap: 1.5rem 4rem; align-items: end; }
.news-grid p { margin: .75rem 0 0; font-family: var(--font-text); font-size: 1.1875rem; line-height: 1.5; color: var(--fg-soft); max-width: 40ch; }
@media (max-width: 800px) { .news-grid { grid-template-columns: minmax(0, 1fr); } }
.field { display: flex; flex-wrap: wrap; gap: .5rem; }
.field input[type="email"] { flex: 1 1 13rem; min-width: 0; padding: .75rem 1rem; background: var(--bg-raise); border: 1px solid var(--line-strong); border-radius: 10px; }
.field input::placeholder { color: var(--muted); }
input:focus-visible { outline-offset: 2px; border-radius: 10px; border-color: var(--accent); }
input[aria-invalid="true"] { border-color: var(--danger); }
.form-msg { min-height: 1.4em; margin: .6rem 0 0 !important; font-family: var(--font-display) !important; font-size: .875rem !important; line-height: 1.4 !important; color: var(--muted) !important; }
.form-msg.err { color: var(--danger) !important; }
.sub fieldset { border: 0; margin: 0 0 1.25rem; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem; }
.sub legend { padding: 0; margin-bottom: .75rem; font-family: var(--font-mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sub label.opt { display: flex; align-items: center; gap: .6rem; padding: .65rem .85rem; border: 1px solid var(--line-strong); border-radius: 10px; cursor: pointer; font-size: .9375rem; }
.sub label.opt input { accent-color: var(--accent); width: 1rem; height: 1rem; }
.thanks { border: 1px solid var(--line-strong); border-radius: 10px; padding: 1.25rem 1.5rem; background: var(--bg-raise); }
.thanks h3 { margin: 0 0 .4rem; font-size: 1.375rem; letter-spacing: -.02em; }
.thanks p { margin: 0 !important; font-size: 1.0625rem !important; }
.sub-page { max-width: 34rem; margin-top: 2rem; }

/* Footer */
.site-foot { border-top: 1px solid var(--line); padding-block: 3rem 2.5rem; }
.foot-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(2, minmax(0, 1fr)); gap: 2rem; }
.foot-grid h2 { margin: 0 0 .75rem; font: 500 .75rem var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  ];

  const POSTS = [
    {
      slug: 'contrast-is-not-a-number',
      title: 'Contrast is not a number',
      deck: 'A ratio can pass an audit and still tire the reader. Notes on setting type on dark backgrounds.',
      cat: 'design', author: 'adeniyi', date: '2026-11-04',
      body: [
        ['p', 'The Web Content Accessibility Guidelines ask for a contrast ratio of at least 4.5 to 1 for body text and 3 to 1 for large text. Those figures are a floor. On a dark page they are easy to clear in ways that still make reading harder than it should be.'],
        ['h', 'Pure white is too much light'],
        ['p', 'White text on a black ground scores 21 to 1, the highest ratio the formula can produce. On a bright screen in a dim room, that is a great deal of light aimed straight at the reader, and thin strokes seem to bloom into the dark around them. Readers call it glare. Pulling the text to an off-white, and the ground to a near-black with a slight blue lean, keeps the ratio above 12 to 1 while letting the letters hold their shape.'],
        ['h', 'Weight changes with the ground'],
        ['p', 'Light type on a dark ground tends to look a little bolder than the same type in black on white. Heavy weights can clog small counters, and hairline weights shimmer. A regular weight, tested at the size readers will actually see, usually sits between the two problems.'],
        ['q', 'A ratio tells you whether text can be read. It cannot tell you whether anyone will want to keep reading.'],
        ['h', 'Accents need their own check'],
        ['p', 'A saturated accent that works on white often vibrates on dark. Lower its saturation and raise its lightness until it sits comfortably beside the body text, then check it twice, once as text and once as a fill. The amber used on this site, `#e9b96e`, measures about 10.8 to 1 against its near-black ground, which makes it safe for small links as well as large buttons.'],
        ['h', 'A short checklist'],
        ['p', 'Before you ship a dark theme, read one full article on it, on a phone, at night. Then read it again at midday near a window. If either session leaves you rubbing your eyes, adjust the ground and the text color first, and the weight second.']
      ]
    },
    {
      slug: 'the-hundred-millisecond-rule',
      title: 'The hundred millisecond rule',
      deck: 'Why 100 ms, 1 second and 10 seconds still describe how interfaces feel, and what they mean for your budget.',
      cat: 'engineering', author: 'adeniyi', date: '2026-10-28',
      body: [
        ['p', 'In his 1993 book *Usability Engineering*, Jakob Nielsen described three response-time limits that he traced to earlier research. About 0.1 seconds feels instantaneous. About 1 second keeps the user’s flow of thought unbroken. About 10 seconds is the most you get before attention wanders. Those numbers come from human perception, so they have not moved as hardware has.'],
        ['h', 'What the browser measures now'],
        ['p', 'Google’s Core Web Vitals turned part of this into a metric. Interaction to Next Paint, or INP, replaced First Input Delay in March 2024. A page is rated good when INP is 200 milliseconds or less at the 75th percentile of visits, and poor above 500 milliseconds.'],
        ['p', 'Notice that 200 ms is twice Nielsen’s limit. The metric is a pass mark for a whole page, not a target for a button that should feel immediate. Treat it as the ceiling.'],
        ['h', 'Spend the budget on purpose'],
        ['p', 'A tap that has to feel instant gets about 100 ms for everything: input handling, state updates, layout and paint. Work out where those milliseconds go before you write the handler. Then put anything slow, such as a network call or a long list, behind visible feedback inside that first 100 ms.'],
        ['c', `const t0 = performance.now();
render(items);
requestAnimationFrame(() => {
  const ms = performance.now() - t0;
  if (ms > 100) console.warn('render took ' + Math.round(ms) + ' ms');
});`, 'JavaScript'],
        ['p', 'The sketch above is a rough gauge. It stops at the next frame, so it misses part of paint and compositing. The Performance panel in your browser’s developer tools shows the full picture.'],
        ['h', 'Measure first, then argue'],
        ['p', 'Most arguments about speed end quickly once someone records a trace. Record one on a mid-range phone, not on the laptop you build with, and keep the budget visible where the whole team will see it.']
      ]
    },
    {
      slug: 'write-the-empty-state-first',
      title: 'Write the empty state first',
      deck: 'The first screen anyone sees has no data in it. Design that one before the others.',
      cat: 'craft', author: 'adeniyi', date: '2026-10-21',
      body: [
        ['p', 'Every list, tracker and dashboard begins empty. Most teams design that state last, if at all, and the result is a blank rectangle with a spinner or a single gray sentence. It is also the one screen every new user is certain to see.'],
        ['h', 'Three jobs'],
        ['p', 'A good empty state does three things. It says what belongs here. It shows how to add the first item. And it hints at what the screen will look like once it is full.'],
        ['p', 'Compare “Nothing to show” with “No invoices yet. Add one and it appears here with its due date and status.” The second version names the object, offers a next step and previews the result in a single line.'],
        ['q', 'An empty screen is a promise about the full one.'],
        ['h', 'Use real examples'],
        ['p', 'When a tool is only for the person who opens it, a few clearly labeled sample rows can teach the layout faster than any copy. Label them as examples and make them easy to clear. When many people will fill the list, keep it honest and leave it empty, but give the empty state the same care as a full one.'],
        ['h', 'Order of work'],
        ['p', 'Sketch the empty state first, then the single-item state, then the full one. Problems with layout tend to show up in the first two, and they cost very little to fix there.']
      ]
    },
    {
      slug: 'routing-with-the-hash',
      title: 'Routing with the hash',
      deck: 'Small sites do not need a router. A location hash, one event and a lookup table cover most of it.',
      cat: 'engineering', author: 'adeniyi', date: '2026-10-14',
      body: [
        ['p', 'A site with a handful of views does not need a routing library. The part of a URL after the `#` never reaches the server, so hash links work on any host with no configuration. Every change also adds a history entry, so the back button behaves the way people expect.'],
        ['h', 'The whole router'],
        ['p', 'Read `location.hash`, look the key up in a table, render, and listen for `hashchange`. That is the entire mechanism.'],
        ['c', `const routes = {
  home: renderHome,
  about: renderAbout,
};

function route() {
  const key = location.hash.slice(1) || 'home';
  (routes[key] || renderNotFound)();
  window.scrollTo(0, 0);
}

addEventListener('hashchange', route);
route();`, 'JavaScript'],
        ['h', 'Three details that matter'],
        ['p', 'First, reset the scroll position after each render, because a new view should open at the top. Second, move focus to the new view’s main heading so keyboard and screen reader users land where sighted users do. Third, update `document.title` so history entries and browser tabs describe where you are.'],
        ['h', 'Where it stops'],
        ['p', 'Hash routing suits a few named views and a lookup by id. Once you need nested layouts, data loading per route or many dynamic paths, a proper router earns its weight. Until then, a short function you can read in one sitting is easier to keep.']
      ]
    },
    {
      slug: 'the-sixty-five-character-line',
      title: 'The sixty-five character line',
      deck: 'Robert Bringhurst put the ideal line at 66 characters. In CSS you can ask for it directly.',
      cat: 'design', author: 'adeniyi', date: '2026-10-07',
      body: [
        ['p', 'In *The Elements of Typographic Style*, Robert Bringhurst calls a line of 45 to 75 characters satisfactory for a single-column page and 66 characters ideal. Much longer, and the eye struggles to find the start of the next line. Much shorter, and sentences break into fragments.'],
        ['h', 'Ask for it in ch'],
        ['p', 'The `ch` unit equals the width of the zero in the current font, so a measure set in `ch` scales with the type.'],
        ['c', `.prose {
  max-width: 65ch;
  line-height: 1.6;
}`, 'CSS'],
        ['p', 'Because the zero is wider than the average lowercase letter in most faces, a 65ch box tends to hold slightly more than 65 characters of running text. If your face runs narrow, lower the number a little and look at the result.'],
        ['h', 'Line height follows line length'],
        ['p', 'A longer line needs more space between lines, so the eye can find its way back. Body text at 1.5 to 1.6 works for a 65-character measure. Shorten the line for a sidebar or a caption and the leading can tighten with it.'],
        ['h', 'On small screens'],
        ['p', 'Phones solve the problem for you, since a 360 pixel viewport at normal body size holds about 40 characters. The risk is on wide monitors, where an unconstrained paragraph can run past 150. Set the maximum, and leave the minimum alone.']
      ]
    },
    {
      slug: 'shipping-less',
      title: 'Shipping less',
      deck: 'Notes on removing a feature, and what the quiet afterward teaches.',
      cat: 'notes', author: 'adeniyi', date: '2026-09-30',
      body: [
        ['p', 'Most of the work I am proud of this year is work I deleted. A settings page lost half its toggles. A dashboard lost two charts nobody could explain. A form lost a field that existed because one customer asked for it in 2019.'],
        ['h', 'Every option is a promise'],
        ['p', 'Each feature you ship comes with a promise to keep it working, to document it and to test it against every feature that arrives later. The cost of that promise grows quietly, and it is paid by whoever touches the code next.'],
        ['h', 'How to decide'],
        ['p', 'Before cutting something, I ask three questions. Who used it in the last ninety days? What do they do instead when it is gone? What would we build if we started today? If the third answer looks nothing like the current feature, the feature is a candidate.'],
        ['q', 'Deleting code is the one refactor that almost always makes the next change cheaper.'],
        ['p', 'After the cut, write a short note saying what changed and why. People forgive a removal they understand much faster than one they discover on their own.']
      ]
    },
    {
      slug: 'a-field-guide-to-focus-rings',
      title: 'A field guide to focus rings',
      deck: 'The ring is how keyboard users know where they are. Keep it, style it, and make sure a sticky header does not hide it.',
      cat: 'craft', author: 'adeniyi', date: '2026-09-23',
      body: [
        ['p', 'A focus ring is the visible marker that shows keyboard and switch users which control will respond when they press a key. Removing it with `outline: none` and offering nothing in its place makes a page close to unusable for them.'],
        ['h', 'Use focus-visible'],
        ['p', 'The `:focus-visible` pseudo-class shows the ring when the browser judges that it helps, which in practice means keyboard focus and not mouse clicks. It removes the usual reason designers give for hiding outlines.'],
        ['c', `:focus-visible {
  outline: 2px solid #e9b96e;
  outline-offset: 3px;
}`, 'CSS'],
        ['h', 'Make it visible against the ground'],
        ['p', 'A ring needs contrast with whatever sits behind it. WCAG 2.1 asks for 3 to 1 against adjacent colors for interface components, under criterion 1.4.11, Non-text Contrast. On a dark page a light accent works well. Offset the ring a few pixels so it does not merge with the control’s own border.'],
        ['h', 'Do not let the header cover it'],
        ['p', 'WCAG 2.2 added criterion 2.4.11, Focus Not Obscured (Minimum), at level AA. A sticky header can hide a control that has just received focus. The fix is usually one line.'],
        ['c', `html {
  scroll-padding-top: 5.5rem; /* sticky header height, plus a little */
}`, 'CSS'],
        ['p', 'This site uses exactly that. Press Tab through any page and watch where the ring lands.']
      ]
    }
  ];

  /* ---------- Helpers ---------- */
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*([^*]+)\*/g, '<em>$1</em>');
  const fmtDate = iso => new Date(iso + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  const topicOf = id => TOPICS.find(t => t.id === id);
  const initials = name => name.split(' ').map(w => w[0]).join('');
  const ARROW = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3 8h9M8.5 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>';

  POSTS.forEach(p => {
    const text = [p.deck].concat(p.body.filter(b => b[0] !== 'c').map(b => b[1])).join(' ');
    p.mins = Math.max(1, Math.round(text.split(/\s+/).length / 230));
    p.hay = (p.title + ' ' + p.deck + ' ' + AUTHORS[p.author].name + ' ' + topicOf(p.cat).name + ' ' + text).toLowerCase();
  });

  /* ---------- Generated cover art: a dot field lit by one or two lamps ---------- */
  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function rng(seed) {
    let s = seed >>> 0;
    return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
  }
  function makeField(slug, cols, rows) {
    const step = 12, W = cols * step, H = rows * step, r = rng(hash(slug));
    const a = { x: (0.22 + 0.56 * r()) * W, y: (0.28 + 0.44 * r()) * H, k: (0.2 + 0.16 * r()) * W };
    const b = { x: (0.1 + 0.8 * r()) * W, y: (0.1 + 0.8 * r()) * H, k: (0.12 + 0.1 * r()) * W };
    const dots = [];
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) dots.push({ x: (i + 0.5) * step, y: (j + 0.5) * step });
    return { W, H, a, b, dots };
  }
  const glow = (x, y, s) => Math.exp(-(((x - s.x) ** 2) + ((y - s.y) ** 2)) / (2 * s.k * s.k));
  const intensity = (d, a, b) => Math.max(glow(d.x, d.y, a), 0.5 * glow(d.x, d.y, b));
  const dotR = I => (0.7 + 2.4 * I).toFixed(2);
  const dotO = I => (0.1 + 0.9 * I).toFixed(2);

  function coverSVG(slug, live) {
    const f = makeField(slug, live ? 36 : 28, live ? 22 : 17);
    const circles = f.dots.map(d => {
      const I = intensity(d, f.a, f.b);
      return '<circle cx="' + d.x + '" cy="' + d.y + '" r="' + dotR(I) + '" fill-opacity="' + dotO(I) + '"></circle>';
    }).join('');
    return '<svg class="cover" viewBox="0 0 ' + f.W + ' ' + f.H + '" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false"><g fill="currentColor">' + circles + '</g></svg>';
  }

  function bindLamp(el, slug) {
    const f = makeField(slug, 36, 22);
    const circles = $$('circle', el);
    const svg = $('svg', el);
    let light = f.a, raf = 0;
    function draw() {
      raf = 0;
      f.dots.forEach((d, i) => {
        const I = intensity(d, light, f.b);
        circles[i].setAttribute('r', dotR(I));
        circles[i].setAttribute('fill-opacity', dotO(I));
      });
    }
    el.addEventListener('pointermove', e => {
      const rc = svg.getBoundingClientRect();
      const sc = Math.max(rc.width / f.W, rc.height / f.H);
      const ox = (rc.width - f.W * sc) / 2, oy = (rc.height - f.H * sc) / 2;
      light = { x: (e.clientX - rc.left - ox) / sc, y: (e.clientY - rc.top - oy) / sc, k: f.a.k * 1.1 };
      if (!raf) raf = requestAnimationFrame(draw);
    });
  }

  /* ---------- Parts ---------- */
  function metaLine(p, withTopic) {
    return '<div class="meta">' + (withTopic ? '<span class="tag">' + esc(topicOf(p.cat).name) + '</span>' : '') +

  }

    return '<a class="row" href="#post-' + p.slug + '"><div class="thumb">' + coverSVG(p.slug) + '</div>' +

  function subscribeForm(id, full) {
    return '<form class="sub" data-subscribe novalidate>' +
      '<div class="field"><label class="sr-only" for="' + id + '">Email address</label>' +

      '<button class="btn" type="submit">Join the list</button></div>' +

  function newsBand() {

      '<div>' + subscribeForm('sub-band-email', false) + '</div></div></section>';
  }

  /* ---------- Views ---------- */
  function viewHome() {
    const f = POSTS[0];
    const latest = POSTS.slice(1, 5);
    return '<h1 class="sr-only">Low Light, a journal about making things for the web</h1>' +
      '<section class="hero"><div class="wrap hero-grid">' +
      '<div class="hero-copy">' +
      '<p class="kicker"><b>Featured</b> · ' + esc(topicOf(f.cat).name) + '</p>' +
      '<h2 class="hero-title"><a href="#post-' + f.slug + '">' + esc(f.title) + '</a></h2>' +
      '<p class="hero-deck">' + esc(f.deck) + '</p>' +
      '<div class="meta"><span>' + esc(AUTHORS[f.author].name) + '</span><span>' + fmtDate(f.date) + '</span><span>' + f.mins + ' min read</span></div>' +
      '<a class="btn" href="#post-' + f.slug + '">Read the essay ' + ARROW + '</a></div>' +
      '<div class="hero-visual" id="lamp">' + coverSVG(f.slug, true) + '<span class="hint" aria-hidden="true">Move the light</span></div>' +
      '</div></section>' +
      '<section class="band band-line"><div class="wrap"><div class="section-head"><h2 class="h-section">Topics</h2></div><div class="topics">' +
      TOPICS.map(t => {
        const n = POSTS.filter(p => p.cat === t.id).length;
        return '<a class="topic" href="#journal-' + t.id + '"><span class="count">' + n + (n === 1 ? ' entry' : ' entries') + '</span><h3>' + esc(t.name) + '</h3><p>' + esc(t.blurb) + '</p></a>';
      }).join('') + '</div></div></section>' +
      '<section class="band band-line"><div class="wrap"><div class="section-head"><h2 class="h-section">Latest</h2>' +
      '<a class="more" href="#journal">All ' + POSTS.length + ' entries ' + ARROW + '</a></div>' +
      '<div class="grid-2">' + latest.map(card).join('') + '</div></div></section>' +
      newsBand();
  }

  const state = { topic: null, q: '', focusSearch: false };

  function filtered() {
    const q = state.q.trim().toLowerCase();
    return POSTS.filter(p => (!state.topic || p.cat === state.topic) && (!q || p.hay.indexOf(q) !== -1));
  }
  function resultsHtml() {

  }
  function renderResults() { const el = $('#results'); if (el) el.innerHTML = resultsHtml(); }

  function viewJournal(topicId) {
    state.topic = topicId;
    const t = topicId ? topicOf(topicId) : null;
    return '<section class="page-head"><div class="wrap">' +
      '<p class="kicker">' + (t ? 'Journal · ' + esc(t.name) : 'Journal') + '</p>' +
      '<h1 class="h-page">' + (t ? esc(t.name) : 'Everything we’ve published') + '</h1>' +
      '<p class="lede">' + (t ? esc(t.blurb) : POSTS.length + ' entries across four topics. One new essay arrives every Wednesday.') + '</p>' +
      '<div class="tools"><label class="search"><span class="sr-only">Search entries</span>' +
      '<svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"></circle><path d="M12.2 12.2L16 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>' +
      '<input id="q" type="search" placeholder="Search titles and ideas" autocomplete="off"></label>' +
      '<nav class="chips" aria-label="Filter by topic"><a class="chip" href="#journal"' + (!t ? ' aria-current="page"' : '') + '>All</a>' +
      TOPICS.map(x => '<a class="chip" href="#journal-' + x.id + '"' + (t && t.id === x.id ? ' aria-current="page"' : '') + '>' + esc(x.name) + '</a>').join('') +
      '</nav></div></div></section>' +
      '<section class="wrap" style="padding-bottom:clamp(3rem,6vw,5rem)"><div id="results" aria-live="polite">' + resultsHtml() + '</div></section>' +
      newsBand();
  }

  function proseHtml(p) {
    let n = 0;
    return p.body.map(b => {
      if (b[0] === 'h') { n++; return '<h2 id="s' + n + '">' + inline(b[1]) + '</h2>'; }
      if (b[0] === 'q') return '<blockquote><p>' + inline(b[1]) + '</p></blockquote>';
      if (b[0] === 'c') return '<figure class="code"><figcaption><span>' + esc(b[2] || '') + '</span><button type="button" class="copy" data-copy>Copy</button></figcaption><pre><code>' + esc(b[1]) + '</code></pre></figure>';
      return '<p>' + inline(b[1]) + '</p>';
    }).join('');
  }

  function viewPost(p) {
    const a = AUTHORS[p.author], t = topicOf(p.cat);
    const i = POSTS.indexOf(p);
    const newer = POSTS[i - 1], older = POSTS[i + 1];
    const heads = p.body.filter(b => b[0] === 'h');
    let related = POSTS.filter(x => x !== p && x.cat === p.cat);
    POSTS.forEach(x => { if (x !== p && related.indexOf(x) === -1 && related.length < 2) related.push(x); });
    related = related.slice(0, 2);
    return '<article>' +
      '<div class="wrap post-head">' +
      '<nav class="crumbs" aria-label="Breadcrumb"><a href="#journal">Journal</a><span aria-hidden="true">/</span><a href="#journal-' + t.id + '">' + esc(t.name) + '</a></nav>' +
      '<h1 class="post-title">' + esc(p.title) + '</h1>' +
      '<p class="post-deck">' + esc(p.deck) + '</p>' +
      '<div class="byline"><div class="by-who"><span class="avatar" aria-hidden="true">' + esc(initials(a.name)) + '</span><div><div class="by-name">' + esc(a.name) + '</div><div class="meta"><span>' + esc(a.role) + '</span></div></div></div>' +
      '<div class="meta"><span>' + fmtDate(p.date) + '</span><span>' + p.mins + ' min read</span></div></div>' +
      '</div>' +
      '<div class="wrap"><div class="thumb post-cover">' + coverSVG(p.slug) + '</div></div>' +
      '<div class="wrap post-grid">' +
      '<aside class="toc" aria-label="In this piece"><p class="kicker">In this piece</p>' +
      heads.map((h, k) => '<button type="button" data-jump="s' + (k + 1) + '">' + esc(h[1]) + '</button>').join('') + '</aside>' +
      '<div><div class="prose" id="article">' + proseHtml(p) + '</div>' +
      '<div class="share"><span class="kicker">Share</span><button type="button" class="btn btn-ghost btn-small" data-copylink>Copy link</button></div>' +
      '<div class="author-box"><span class="avatar" aria-hidden="true">' + esc(initials(a.name)) + '</span><div><div class="by-name">' + esc(a.name) + '</div><div class="meta"><span>' + esc(a.role) + '</span></div><p>' + esc(a.bio) + '</p></div></div>' +
      '<nav class="pn" aria-label="More entries">' +
      (newer ? '<a href="#post-' + newer.slug + '"><span class="kicker">Newer</span><strong>' + esc(newer.title) + '</strong></a>' : '<span></span>') +
      (older ? '<a href="#post-' + older.slug + '"><span class="kicker">Older</span><strong>' + esc(older.title) + '</strong></a>' : '<span></span>') +
      '</nav></div></div></article>' +
      '<section class="band band-line"><div class="wrap"><div class="section-head"><h2 class="h-section">Keep reading</h2></div><div class="grid-2">' + related.map(card).join('') + '</div></div></section>' +
      newsBand();
  }

  function viewAbout() {
    return '<section class="page-head"><div class="wrap"><p class="kicker">About</p>' +
      '<h1 class="h-page">A small journal for people who make things for the web.</h1>' +
      '<p class="lede">Low Light publishes one essay a week on design, engineering and the habits that make both better. We write for people who read at night, on phones, between other things.</p></div></section>' +
      '<section class="band band-line"><div class="wrap"><div class="section-head"><h2 class="h-section">How we work</h2></div><div class="principles">' +
      '<div><h3>One idea per piece</h3><p>Each entry argues for a single thing and stops when it has.</p></div>' +
      '<div><h3>Numbers we can show</h3><p>We name the thresholds, units and sources we rely on, so you can check them.</p></div>' +
      '<div><h3>Readable first</h3><p>Every page is read on a phone, in the dark, before it is published.</p></div>' +
      '</div></div></section>' +
      '<section class="band band-line"><div class="wrap"><div class="section-head"><h2 class="h-section">The editor</h2></div><div class="people">' +
      Object.keys(AUTHORS).map(k => {
        const a = AUTHORS[k], n = POSTS.filter(p => p.author === k).length;
        return '<div class="person"><span class="avatar" aria-hidden="true">' + esc(initials(a.name)) + '</span><div><h3>' + esc(a.name) + '</h3><div class="meta"><span>' + esc(a.role) + '</span><span>' + n + (n === 1 ? ' entry' : ' entries') + '</span></div></div><p>' + esc(a.bio) + '</p></div>';
      }).join('') + '</div></div></section>' +
      '<section class="band band-line"><div class="wrap two-col"><h2 class="h-section">Get in touch</h2><div class="body">' +
      '<p>Write with questions, corrections or an idea for an essay. A short note is plenty.</p>' +
      '<div class="mail"><code>adendan62@outlook.com</code><button type="button" class="btn btn-ghost btn-small" data-copytext="adendan62@outlook.com">Copy address</button></div></div></div></section>' +
      '<section class="band band-line"><div class="wrap two-col"><h2 class="h-section">Colophon</h2><div class="body">' +
      '<p>Set in Bricolage Grotesque for headings, Newsreader for reading and JetBrains Mono for details. The cover art on every entry is generated from the entry’s title, so no two are alike.</p></div></div></section>';
  }

  function viewSubscribe() {
    return '<section class="page-head"><div class="wrap"><p class="kicker">Subscribe</p>' +
      '<h1 class="h-page">The Wednesday issue</h1>' +
      '<p class="lede">One essay a week, plus the two links we kept coming back to. Choose the topics you want and leave the rest.</p>' +
      '<div class="sub-page">' + subscribeForm('sub-page-email', true) + '</div></div></section>' +
      '<section class="band band-line"><div class="wrap"><div class="section-head"><h2 class="h-section">Recent issues</h2></div><div class="grid-2">' + POSTS.slice(0, 2).map(card).join('') + '</div></div></section>';
  }

  function viewMissing() {
    return '<section class="page-head"><div class="wrap"><p class="kicker">404</p>' +
      '<h1 class="h-page">That page is not here.</h1>' +
      '<p class="lede">The link may be old, or the entry may have moved.</p>' +
      '<p style="margin-top:1.5rem;display:flex;gap:.75rem;flex-wrap:wrap"><a class="btn" href="#home">Back to the front page</a><a class="btn btn-ghost" href="#journal">Browse the journal</a></p></div></section>';
  }

  /* ---------- Footer ---------- */
  $('#foot').innerHTML = '<div class="wrap"><div class="foot-grid">' +
    '<div><a class="brand" href="#home">Low Light</a><p>A journal about making things for the web, edited by Adeniyi Daniel. New essay every Wednesday.</p></div>' +
    '<div><h2>Read</h2><ul><li><a href="#journal">All entries</a></li>' +
    TOPICS.map(t => '<li><a href="#journal-' + t.id + '">' + esc(t.name) + '</a></li>').join('') + '</ul></div>' +
    '<div><h2>Site</h2><ul><li><a href="#about">About</a></li><li><a href="#subscribe">Subscribe</a></li></ul></div>' +
    '</div><div class="legal"><span>© 2026 Adeniyi Daniel</span><span>adendan62@outlook.com</span></div></div>';

  /* ---------- Router ---------- */
  function resolve() {
    const key = (location.hash || '').slice(1) || 'home';
    if (key === 'home') return { nav: 'home', title: 'Low Light', html: viewHome() };
    if (key === 'journal') return { nav: 'journal', title: 'Journal · Low Light', html: viewJournal(null) };
    if (key.indexOf('journal-') === 0) {
      const t = topicOf(key.slice(8));
      if (t) return { nav: 'journal', title: t.name + ' · Low Light', html: viewJournal(t.id) };
    }
    if (key === 'about') return { nav: 'about', title: 'About · Low Light', html: viewAbout() };
    if (key === 'subscribe') return { nav: 'subscribe', title: 'Subscribe · Low Light', html: viewSubscribe() };
    if (key.indexOf('post-') === 0) {
      const p = POSTS.find(x => x.slug === key.slice(5));
      if (p) return { nav: 'journal', title: p.title + ' · Low Light', html: viewPost(p), post: true };
    }
    return { nav: '', title: 'Not found · Low Light', html: viewMissing() };
  }

  function render(initial) {
    state.q = '';
    const r = resolve();
    $('#main').innerHTML = r.html;
    document.title = r.title;
    $$('[data-nav]').forEach(a => {
      if (a.dataset.nav === r.nav) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    $('#progress').hidden = !r.post;
    if (!initial) window.scrollTo(0, 0);
    const lamp = $('#lamp');
    if (lamp) bindLamp(lamp, POSTS[0].slug);
    if (!initial) {
      const h = $('#main h1');
      if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
    }
    if (state.focusSearch) {
      state.focusSearch = false;
      const q = $('#q');
      if (q) q.focus();
    }
    updateProgress();
  }

  /* ---------- Reading progress and contents ---------- */
  let ticking = false;
  function updateProgress() {
    const art = $('#article');
    const bar = $('#progress span');
    if (!art) { if (bar) bar.style.transform = 'scaleX(0)'; return; }
    const rect = art.getBoundingClientRect();
    const total = Math.max(rect.height - window.innerHeight * 0.6, 1);
    const done = Math.min(1, Math.max(0, (80 - rect.top) / total));
    bar.style.transform = 'scaleX(' + done.toFixed(3) + ')';
    let cur = null;
    $$('h2', art).forEach(h => { if (h.getBoundingClientRect().top < 150) cur = h.id; });
    $$('.toc button').forEach(b => b.classList.toggle('on', b.dataset.jump === cur));
  }
  window.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { ticking = false; updateProgress(); });
  }, { passive: true });
  window.addEventListener('resize', updateProgress);

  /* ---------- Interactions ---------- */
  function legacyCopy(text) {
    const t = document.createElement('textarea');
    t.value = text; t.setAttribute('readonly', '');
    t.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(t); t.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    t.remove();
    return ok;
  }
  function copyText(text, btn) {
    if (!btn.dataset.idle) btn.dataset.idle = btn.textContent;
    const flash = msg => {
      btn.textContent = msg;
      clearTimeout(btn._t);
      btn._t = setTimeout(() => { btn.textContent = btn.dataset.idle; }, 1800);
    };
    const fallback = () => flash(legacyCopy(text) ? 'Copied' : 'Copy failed');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => flash('Copied'), fallback);
    } else { fallback(); }
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('button, [data-jump]');
    if (!t) return;
    if (t.id === 'searchBtn') {
      const q = $('#q');
      if (q) { q.focus(); q.scrollIntoView({ block: 'center' }); }
      else { state.focusSearch = true; location.hash = 'journal'; }
    } else if (t.id === 'skip') {
      const h = $('#main h1');
      if (h) { h.setAttribute('tabindex', '-1'); h.focus(); }
    } else if (t.hasAttribute('data-jump')) {
      const el = document.getElementById(t.dataset.jump);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else if (t.hasAttribute('data-copy')) {
      const code = t.closest('.code').querySelector('code');
      copyText(code.textContent, t);
    } else if (t.hasAttribute('data-copylink')) {
      copyText(location.href, t);
    } else if (t.hasAttribute('data-copytext')) {
      copyText(t.dataset.copytext, t);
    } else if (t.hasAttribute('data-clear')) {
      state.q = '';
      const q = $('#q'); if (q) { q.value = ''; q.focus(); }
      renderResults();
    }
  });

  document.addEventListener('input', e => {
    if (e.target.id === 'q') { state.q = e.target.value; renderResults(); }
  });

  document.addEventListener('submit', async e => {
    const form = e.target.closest('form[data-subscribe]');
    if (!form) return;
    e.preventDefault();

    const input = $('input[name="email"]', form);
    const msg = $('.form-msg', form);
    const button = $('button[type="submit"]', form);
    const email = input.value.trim();
    const honeypot = $('input[name="company"]', form);

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      input.setAttribute('aria-invalid', 'true');
      msg.className = 'form-msg err';
      msg.textContent = 'Enter a valid email address.';
      input.focus();
      return;
    }

    input.removeAttribute('aria-invalid');
    button.disabled = true;
    button.textContent = 'Adding…';
    msg.className = 'form-msg';
    msg.textContent = 'Please wait…';

    try {
      const response = await fetch('/.netlify/functions/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, company: honeypot ? honeypot.value : '' })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || 'Subscription failed. Please try again.');

      const box = document.createElement('div');
      box.className = 'thanks';
      const h = document.createElement('h3'); h.textContent = 'You’re on the list.';
      const p = document.createElement('p'); p.textContent = 'Thanks for subscribing to Low Light. Your email address has been added successfully.';
      box.appendChild(h); box.appendChild(p);
      form.replaceWith(box);
    } catch (error) {
      msg.className = 'form-msg err';
      msg.textContent = error.message || 'Something went wrong. Please try again.';
      button.disabled = false;
      button.textContent = 'Join the list';
    }
  });

  window.addEventListener('hashchange', () => render(false));
  render(true);
})();
</script>
</body>
</html>
