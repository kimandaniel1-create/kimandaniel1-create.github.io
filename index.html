<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A dark, sleek journal about making things for the web, edited by Adeniyi Daniel.">
<meta name="theme-color" content="#0b0c10">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Low Light">
<meta property="og:description" content="A journal about making things for the web.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<title>Low Light</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap">
<style>
:root{color-scheme:dark}[hidden]{display:none!important}
/* Layout concept: a left-aligned editorial grid on a blue-leaning near-black ground.
   One live moment, a dot field lit by a lamp that follows the pointer. Everything else stays quiet. */
:root {
  --bg: #0b0c10;
  --bg-raise: #111319;
  --bg-sunk: #08090c;
  --line: #22252e;
  --line-strong: #343847;
  --fg: #e8e9ee;
  --fg-soft: #c3c6d1;
  --muted: #8a8fa0;
  --accent: #e9b96e;
  --accent-hi: #f2c985;
  --accent-ink: #1b1206;
  --accent-wash: rgba(233, 185, 110, 0.12);
  --danger: #f08c80;

  --font-display: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
  --font-text: 'Newsreader', Georgia, 'Times New Roman', serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

  --step-2: 1.375rem;
  --step-3: clamp(1.65rem, 1.25rem + 1.8vw, 2.25rem);
  --step-4: clamp(2.3rem, 1.4rem + 4.2vw, 4.25rem);

  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: 5.5rem; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 1rem/1.55 var(--font-display);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 30;
}
a { color: inherit; }
button, input { font: inherit; color: inherit; }
img, svg { max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
main { display: block; }
main h1:focus { outline: none; }
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip {
  position: absolute; left: 1rem; top: -4rem; z-index: 40;
  padding: .6rem 1rem; border-radius: 10px; border: 1px solid var(--accent);
  background: var(--bg); color: var(--fg); cursor: pointer;
}
.skip:focus { top: calc(env(safe-area-inset-top, 0px) + .75rem); }

.wrap {
  width: 100%;
  max-width: 1240px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Header */
.site-head {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: rgba(11, 12, 16, 0.9);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.head-row { display: flex; align-items: center; flex-wrap: wrap; gap: .25rem 1.5rem; min-height: 3.5rem; }
.brand { display: inline-flex; align-items: center; gap: .6rem; text-decoration: none; font-weight: 700; font-size: 1.125rem; letter-spacing: -.02em; }
.brand .ring { fill: none; stroke: var(--line-strong); }
.brand .halo { fill: var(--accent); fill-opacity: .22; }
.brand .core { fill: var(--accent); }
.nav { display: flex; gap: 1.25rem; margin-right: auto; }
.nav a { text-decoration: none; color: var(--muted); font-size: .9375rem; padding: .35rem 0; border-bottom: 2px solid transparent; }
.nav a:hover { color: var(--fg); }
.nav a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }
.head-actions { display: flex; align-items: center; gap: .5rem; }
.icon-btn { width: 2.5rem; height: 2.5rem; display: grid; place-items: center; border: 0; background: transparent; border-radius: 8px; color: var(--fg-soft); cursor: pointer; }
.icon-btn:hover { color: var(--accent); }
.pill { padding: .4rem .95rem; border: 1px solid var(--line-strong); border-radius: 999px; font-size: .875rem; font-weight: 500; text-decoration: none; }
.pill:hover { border-color: var(--accent); color: var(--accent); }
.progress { height: 2px; }
.progress span { display: block; height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); }
@media (max-width: 560px) {
  .head-row { padding-top: .25rem; }
  .brand { margin-right: auto; }
  .head-actions { order: 2; }
  .nav { order: 3; flex-basis: 100%; padding-bottom: .4rem; }
}

/* Shared type and parts */
.kicker { font-family: var(--font-mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.kicker b { color: var(--accent); font-weight: 500; }
.meta { display: flex; flex-wrap: wrap; gap: .2rem .9rem; font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }
.meta .tag { color: var(--accent); }
.h-section { font-size: var(--step-3); font-weight: 650; letter-spacing: -.02em; line-height: 1.1; margin: 0; text-wrap: balance; }
.h-page { font-size: var(--step-4); font-weight: 700; letter-spacing: -.03em; line-height: 1.04; margin: .5rem 0 1.1rem; max-width: 20ch; text-wrap: balance; }
.lede { font-family: var(--font-text); font-size: 1.3rem; line-height: 1.5; color: var(--fg-soft); max-width: 46ch; margin: 0; }
.band { padding-block: clamp(2.5rem, 6vw, 5rem); }
.band-line { border-top: 1px solid var(--line); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1.75rem; flex-wrap: wrap; }
.more { color: var(--accent); text-decoration: none; font-size: .9375rem; font-weight: 500; display: inline-flex; gap: .4rem; align-items: center; }
.more:hover { color: var(--accent-hi); }
.more svg { transition: transform .15s; }
.more:hover svg { transform: translateX(3px); }

.btn {
  display: inline-flex; align-items: center; gap: .55rem;
  padding: .72rem 1.15rem; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  border-radius: 10px; font-weight: 600; font-size: .9375rem; text-decoration: none; cursor: pointer;
  transition: background .15s, border-color .15s, color .15s;
}
.btn:hover { background: var(--accent-hi); border-color: var(--accent-hi); }
.btn svg { transition: transform .15s; }
.btn:hover svg { transform: translateX(3px); }
.btn-ghost { background: transparent; color: var(--fg); border-color: var(--line-strong); }
.btn-ghost:hover { background: transparent; border-color: var(--accent); color: var(--accent); }
.btn-small { padding: .35rem .75rem; font-size: .8125rem; }

/* Cover art */
.thumb { aspect-ratio: 16 / 10; max-width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-sunk); color: var(--accent); overflow: hidden; transition: border-color .2s; }
.thumb svg, .hero-visual svg { display: block; width: 100%; height: 100%; }
.thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.cover, .thumb img { transition: transform .5s ease; }

/* Hero */
.hero { padding-block: clamp(2rem, 5vw, 4rem) clamp(2.5rem, 6vw, 5rem); }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: clamp(1.5rem, 4vw, 4rem); align-items: center; }
.hero-copy { display: flex; flex-direction: column; gap: 1.1rem; align-items: flex-start; min-width: 0; }
.hero-title { font-size: var(--step-4); font-weight: 700; letter-spacing: -.035em; line-height: 1.02; margin: 0; text-wrap: balance; }
.hero-title a { text-decoration: none; }
.hero-title a:hover { color: var(--accent); }
.hero-deck { font-family: var(--font-text); font-size: 1.3rem; line-height: 1.5; color: var(--fg-soft); margin: 0; max-width: 40ch; }
.hero-visual {
  position: relative; aspect-ratio: 36 / 22; max-width: 100%;
  border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  background: radial-gradient(120% 90% at 30% 40%, rgba(233, 185, 110, 0.06), transparent 60%), var(--bg-sunk);
  color: var(--accent); touch-action: pan-y; cursor: crosshair;
}
.hint { position: absolute; left: .9rem; bottom: .7rem; font: 500 .72rem var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); pointer-events: none; }
@media (max-width: 900px) { .hero-grid { grid-template-columns: minmax(0, 1fr); } }

/* Topics */
.topics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.topic { display: flex; flex-direction: column; gap: .5rem; padding: 1.25rem 1.5rem 1.75rem 0; border-top: 1px solid var(--line-strong); text-decoration: none; }
.topic .count { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }
.topic h3 { margin: 0; font-size: 1.5rem; letter-spacing: -.02em; font-weight: 650; }
.topic p { margin: 0; color: var(--fg-soft); font-family: var(--font-text); font-size: 1.0625rem; line-height: 1.45; }
.topic:hover h3 { color: var(--accent); }
@media (max-width: 900px) { .topics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .topics { grid-template-columns: minmax(0, 1fr); } }

/* Image slider
   A scroll-snap list. The browser does the scrolling, so touch, trackpad and keyboard all work natively.
   The small padding and matching negative margin leave room for focus rings that the scroller would clip. */
.slider-tools { display: flex; align-items: center; gap: 1rem; }
.slider-count { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.slider-controls { display: flex; gap: .5rem; }
.slider-btn {
  width: 2.5rem; height: 2.5rem; display: grid; place-items: center; padding: 0;
  border: 1px solid var(--line-strong); border-radius: 50%; background: var(--bg-raise); color: var(--fg); cursor: pointer;
  transition: border-color .15s, color .15s, background .15s, opacity .15s;
}
.slider-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--bg-sunk); }
.slider-btn:disabled { color: var(--muted); border-color: var(--line); opacity: .45; cursor: default; }
.slider-track {
  list-style: none; margin: -6px -6px 0; padding: 6px 6px .9rem;
  display: flex; gap: 1.25rem;
  overflow-x: auto; overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory; scroll-padding-inline: 6px;
  scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent;
}
.slider-track::-webkit-scrollbar { height: 6px; }
.slider-track::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 999px; }
.slider-item { flex: 0 0 calc((100% - 2.5rem) / 3); display: flex; scroll-snap-align: start; }
.slide { display: flex; flex-direction: column; gap: .75rem; width: 100%; min-width: 0; text-decoration: none; }
.slide h3 { margin: 0; font-size: 1.1875rem; font-weight: 650; line-height: 1.25; letter-spacing: -.015em; text-wrap: balance; }
.slide p {
  margin: 0; color: var(--fg-soft); font-family: var(--font-text); font-size: 1rem; line-height: 1.45;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden;
}
.slide:hover h3 { color: var(--accent); }
.slide:hover .thumb { border-color: var(--line-strong); }
.slide:hover .cover, .slide:hover .thumb img { transform: scale(1.04); }
@media (max-width: 900px) { .slider-item { flex-basis: calc((100% - 1.25rem) / 2); } }
@media (max-width: 560px) { .slider-item { flex-basis: 82%; } }

/* Cards and rows */
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.75rem 2rem; }
@media (max-width: 700px) { .grid-2 { grid-template-columns: minmax(0, 1fr); } }
.card { display: flex; flex-direction: column; gap: .85rem; text-decoration: none; min-width: 0; }
.card h3 { margin: 0; font-size: var(--step-2); line-height: 1.2; letter-spacing: -.015em; font-weight: 650; text-wrap: balance; }
.card p { margin: 0; color: var(--fg-soft); font-family: var(--font-text); font-size: 1.0625rem; line-height: 1.5; }
.card:hover h3, .row:hover h3 { color: var(--accent); }
.card:hover .thumb, .row:hover .thumb { border-color: var(--line-strong); }
.card:hover .cover, .row:hover .cover, .card:hover .thumb img, .row:hover .thumb img { transform: scale(1.04); }

.row { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: 1.25rem 1.75rem; padding-block: 1.5rem; border-top: 1px solid var(--line); text-decoration: none; align-items: start; }
.row:last-child { border-bottom: 1px solid var(--line); }
.row-body { display: flex; flex-direction: column; gap: .5rem; min-width: 0; }
.row h3 { margin: 0; font-size: 1.5rem; line-height: 1.2; letter-spacing: -.02em; font-weight: 650; text-wrap: balance; }
.row p { margin: 0; color: var(--fg-soft); font-family: var(--font-text); font-size: 1.0625rem; line-height: 1.5; max-width: 60ch; }
.row .thumb { aspect-ratio: 4 / 3; }
@media (max-width: 560px) {
  .row { grid-template-columns: 6.5rem minmax(0, 1fr); gap: 1rem; }
  .row .thumb { aspect-ratio: 1 / 1; }
  .row h3 { font-size: 1.2rem; }
  .row p { display: none; }
}

/* Journal tools */
.page-head { padding-block: clamp(2.5rem, 6vw, 4.5rem) 1.5rem; }
.tools { display: flex; flex-direction: column; gap: 1rem; margin-block: 2rem 1.5rem; }
.search { position: relative; display: block; max-width: 26rem; }
.search svg { position: absolute; left: .9rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { width: 100%; padding: .75rem 1rem .75rem 2.6rem; background: var(--bg-raise); border: 1px solid var(--line-strong); border-radius: 10px; }
.search input::placeholder { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; }
.chip { padding: .4rem .9rem; border: 1px solid var(--line-strong); border-radius: 999px; font-size: .875rem; text-decoration: none; color: var(--fg-soft); }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip[aria-current="page"] { background: var(--accent-wash); border-color: var(--accent); color: var(--accent); }
.count-line { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); margin: 0 0 1rem; }
.empty { border: 1px dashed var(--line-strong); border-radius: 10px; padding: clamp(1.5rem, 4vw, 2.5rem); max-width: 38rem; }
.empty h3 { margin: 0 0 .5rem; font-size: 1.5rem; letter-spacing: -.02em; }
.empty p { margin: 0 0 1.25rem; color: var(--fg-soft); font-family: var(--font-text); font-size: 1.125rem; line-height: 1.5; }
.empty strong { color: var(--fg); font-weight: 500; overflow-wrap: anywhere; }

/* Post */
.post-head { padding-block: clamp(1.5rem, 4vw, 3rem) 1.75rem; display: flex; flex-direction: column; gap: 1.25rem; align-items: flex-start; }
.crumbs { display: flex; flex-wrap: wrap; gap: .6rem; font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }
.crumbs a { text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.post-title { font-size: var(--step-4); font-weight: 700; letter-spacing: -.035em; line-height: 1.03; margin: 0; max-width: 18ch; text-wrap: balance; }
.post-deck { font-family: var(--font-text); font-size: 1.4rem; line-height: 1.45; color: var(--fg-soft); margin: 0; max-width: 40ch; }
.byline { display: flex; align-items: center; gap: .85rem 1.25rem; flex-wrap: wrap; }
.by-who { display: flex; align-items: center; gap: .8rem; }
.by-name { font-weight: 600; line-height: 1.2; }
.avatar { flex: none; width: 2.5rem; height: 2.5rem; border-radius: 50%; display: grid; place-items: center; background: var(--accent-wash); color: var(--accent); font: 500 .8rem var(--font-mono); border: 1px solid rgba(233, 185, 110, 0.3); }
.post-cover { aspect-ratio: 21 / 8; border-radius: 14px; }
@media (max-width: 700px) { .post-cover { aspect-ratio: 16 / 10; } }
.post-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 3rem; padding-block: 2.5rem 3rem; }
@media (min-width: 1080px) { .post-grid { grid-template-columns: 13rem minmax(0, 65ch); gap: 4rem; } }
.toc { display: none; }
@media (min-width: 1080px) {
  .toc { display: block; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 5.5rem); align-self: start; }
}
.toc .kicker { margin-bottom: .75rem; }
.toc button { display: block; width: 100%; text-align: left; background: none; border: 0; border-left: 1px solid var(--line); padding: .45rem 0 .45rem .9rem; color: var(--muted); font-size: .875rem; line-height: 1.35; cursor: pointer; }
.toc button:hover { color: var(--fg); }
.toc button.on { color: var(--fg); border-left-color: var(--accent); }

.prose { font-family: var(--font-text); font-size: 1.1875rem; line-height: 1.7; color: var(--fg-soft); font-optical-sizing: auto; }
.prose p { margin: 0 0 1.4em; }
.prose > p:first-child { font-size: 1.3125rem; line-height: 1.6; color: var(--fg); }
.prose h2 { font-family: var(--font-display); font-size: 1.625rem; font-weight: 650; letter-spacing: -.02em; line-height: 1.2; color: var(--fg); margin: 2.4em 0 .7em; text-wrap: balance; }
.prose em { color: var(--fg); }
.prose code { font-family: var(--font-mono); font-size: .8em; background: var(--bg-raise); border: 1px solid var(--line); padding: .1em .38em; border-radius: 5px; color: var(--fg); overflow-wrap: anywhere; }
.prose blockquote { margin: 2.2em 0; padding: 1.3em 0; border-block: 1px solid var(--line-strong); }
.prose blockquote p { margin: 0; font-family: var(--font-display); font-size: clamp(1.4rem, 1.1rem + 1.4vw, 1.9rem); line-height: 1.25; letter-spacing: -.02em; font-weight: 600; color: var(--fg); text-wrap: balance; }
.code { margin: 1.8em 0; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-sunk); overflow: hidden; }
.code figcaption { display: flex; justify-content: space-between; align-items: center; padding: .45rem .5rem .45rem 1rem; border-bottom: 1px solid var(--line); font: 500 .72rem var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.code pre { margin: 0; padding: 1rem; overflow-x: auto; font: 400 .875rem/1.65 var(--font-mono); color: var(--fg); tab-size: 2; }
.code pre code { background: none; border: 0; padding: 0; font-size: inherit; color: inherit; }
.copy { background: transparent; border: 1px solid var(--line-strong); color: var(--fg-soft); border-radius: 6px; padding: .25rem .6rem; font: 500 .72rem var(--font-mono); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
.copy:hover { border-color: var(--accent); color: var(--accent); }

.share { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; padding-block: 1.25rem; border-top: 1px solid var(--line); }
.author-box { display: flex; gap: 1rem; align-items: flex-start; padding-block: 1.5rem; border-top: 1px solid var(--line); }
.author-box p { margin: .25rem 0 0; color: var(--fg-soft); font-family: var(--font-text); font-size: 1.0625rem; line-height: 1.5; }
.pn { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; padding-top: 1.5rem; border-top: 1px solid var(--line); }
.pn a { display: flex; flex-direction: column; gap: .35rem; text-decoration: none; min-width: 0; }
.pn a:last-child { text-align: right; align-items: flex-end; }
.pn strong { font-size: 1.0625rem; font-weight: 600; line-height: 1.3; text-wrap: balance; }
.pn a:hover strong { color: var(--accent); }
@media (max-width: 560px) { .pn { grid-template-columns: minmax(0, 1fr); } .pn a:last-child { text-align: left; align-items: flex-start; } }

/* About */
.principles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2rem; }
.principles > div { border-top: 1px solid var(--line-strong); padding-top: 1rem; }
.principles h3 { margin: 0 0 .5rem; font-size: 1.25rem; letter-spacing: -.015em; }
.principles p { margin: 0; color: var(--fg-soft); font-family: var(--font-text); font-size: 1.0625rem; line-height: 1.5; }
@media (max-width: 800px) { .principles { grid-template-columns: minmax(0, 1fr); } }
.people { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 28rem)); gap: 2rem; }
.person { display: flex; flex-direction: column; gap: .75rem; align-items: flex-start; }
.person h3 { margin: 0; font-size: 1.25rem; letter-spacing: -.015em; }
.person p { margin: 0; color: var(--fg-soft); font-family: var(--font-text); font-size: 1.0625rem; line-height: 1.5; }
@media (max-width: 800px) { .people { grid-template-columns: minmax(0, 1fr); } }
.mail { display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; margin-top: 1.25rem; }
.mail code { font: 500 1rem var(--font-mono); color: var(--fg); overflow-wrap: anywhere; user-select: all; }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 1.5rem 4rem; }
@media (max-width: 800px) { .two-col { grid-template-columns: minmax(0, 1fr); } }

@media (prefers-reduced-motion: reduce) {

}

/* Article content written in the dashboard */

/* Image gallery inside an article

<script>

      .filter(p => p && p.title && !(p.draft === true || p.draft === 'true'))

        o.galleryPos = pick(p.gallery_position, ['before', 'after-intro', 'end'], 'after-intro');

        o.authorName = String(p.author || '').trim() || SITE.editor_name || '';
        const words = (o.deck + ' ' + o.body.replace(/```[\s\S]*?```/g, ' ')).split(/\s+/).filter(Boolean).length;
        o.mins = Math.max(1, Math.round(words / 230));
        o.hay = (o.title + ' ' + o.deck + ' ' + o.authorName + ' ' + o.topicName + ' ' + o.tags.map(t => t.name).join(' ') + ' ' + o.gallery.map(g => g.alt + ' ' + g.cap).join(' ') + ' ' + o.body).toLowerCase();

      });
    POSTS.sort((a, b) => (b.dateObj ? b.dateObj.getTime() : 0) - (a.dateObj ? a.dateObj.getTime() : 0));

    // The hero is the newest entry marked Featured, or simply the newest entry when none is marked.

    const tagIndex = {};
    TAGS = [];
    POSTS.forEach(p => p.tags.forEach(t => {
      if (!tagIndex[t.id]) { tagIndex[t.id] = { id: t.id, name: t.name, n: 0 }; TAGS.push(tagIndex[t.id]); }

  function inl(s) {

  function mdBlocks(md) {
    const L = String(md || '').replace(/\r\n?/g, '\n').split('\n');

  const LANGS = { js: 'JavaScript', javascript: 'JavaScript', ts: 'TypeScript', typescript: 'TypeScript', css: 'CSS', html: 'HTML', json: 'JSON', bash: 'Shell', sh: 'Shell', shell: 'Shell', py: 'Python', python: 'Python' };

  // Returns the article as separate blocks (parts) as well as one string, and the index of the first

    const heads = [];
    let n = 0, intro = -1;
    const parts = mdBlocks(md).map((b, idx) => {
      if (b.t === 'p' && intro < 0) intro = idx;
      switch (b.t) {
        case 'h2': n++; heads.push({ id: 's' + n, text: b.text }); return '<h2 id="s' + n + '">' + inl(b.text) + '</h2>';
        case 'h3': return '<h3>' + inl(b.text) + '</h3>';
        case 'q': return '<blockquote><p>' + inl(b.text) + '</p></blockquote>';
        case 'code': {
          const label = LANGS[b.lang.toLowerCase()] || (b.lang ? b.lang.toUpperCase() : 'Code');
          return '<figure class="code"><figcaption><span>' + esc(label) + '</span><button type="button" class="copy" data-copy>Copy</button></figcaption><pre><code>' + esc(b.text) + '</code></pre></figure>';
        }
        case 'img':
          if (!safeUrl(b.src)) return '';
          return '<figure class="pic"><img src="' + esc(b.src) + '" alt="' + esc(b.alt) + '" loading="lazy">' + (b.cap ? '<figcaption>' + esc(b.cap) + '</figcaption>' : '') + '</figure>';
        case 'ul': case 'ol': return '<' + b.t + '>' + b.items.map(x => '<li>' + inl(x) + '</li>').join('') + '</' + b.t + '>';
        default: return '<p>' + inl(b.text).replace(/\n/g, '<br>') + '</p>';
      }
    });
    return { html: parts.join(''), heads: heads, parts: parts, intro: intro };
  }

  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function rng(seed) {
    let s = seed >>> 0;
    return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
  }
  function makeField(slug, cols, rows) {
    const step = 12, W = cols * step, H = rows * step, r = rng(hash(slug));
    const a = { x: (0.22 + 0.56 * r()) * W, y: (0.28 + 0.44 * r()) * H, k: (0.2 + 0.16 * r()) * W };
    const b = { x: (0.1 + 0.8 * r()) * W, y: (0.1 + 0.8 * r()) * H, k: (0.12 + 0.1 * r()) * W };
    const dots = [];
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) dots.push({ x: (i + 0.5) * step, y: (j + 0.5) * step });
    return { W: W, H: H, a: a, b: b, dots: dots };
  }
  const glow = (x, y, s) => Math.exp(-(((x - s.x) ** 2) + ((y - s.y) ** 2)) / (2 * s.k * s.k));
  const intensity = (d, a, b) => Math.max(glow(d.x, d.y, a), 0.5 * glow(d.x, d.y, b));
  const dotR = I => (0.7 + 2.4 * I).toFixed(2);
  const dotO = I => (0.1 + 0.9 * I).toFixed(2);

  function coverSVG(slug, live) {
    const f = makeField(slug, live ? 36 : 28, live ? 22 : 17);
    const circles = f.dots.map(d => {
      const I = intensity(d, f.a, f.b);
      return '<circle cx="' + d.x + '" cy="' + d.y + '" r="' + dotR(I) + '" fill-opacity="' + dotO(I) + '"></circle>';
    }).join('');
    return '<svg class="cover" viewBox="0 0 ' + f.W + ' ' + f.H + '" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false"><g fill="currentColor">' + circles + '</g></svg>';
  }

  /* One place decides what a cover looks like: the entry's own image when it has one,
     otherwise the generated dot field. If an image fails to load, the error handler
     at the bottom of this file swaps the dot field back in. */
  function renderPostVisual(p) {
    if (p.coverImage && safeUrl(p.coverImage)) {
      return '<img src="' + esc(p.coverImage) + '" alt="' + esc(p.coverAlt) + '" data-slug="' + esc(p.slug) + '" loading="lazy" decoding="async">';
    }
    return coverSVG(p.slug);
  }

  function bindLamp(el, slug) {
    const f = makeField(slug, 36, 22);
    const circles = $$('circle', el);
    const svg = $('svg', el);
    let light = f.a, raf = 0;
    function draw() {
      raf = 0;
      f.dots.forEach((d, i) => {
        const I = intensity(d, light, f.b);
        circles[i].setAttribute('r', dotR(I));
        circles[i].setAttribute('fill-opacity', dotO(I));
      });
    }
    el.addEventListener('pointermove', e => {
      if (!svg) return;
      const rc = svg.getBoundingClientRect();
      const sc = Math.max(rc.width / f.W, rc.height / f.H);
      const ox = (rc.width - f.W * sc) / 2, oy = (rc.height - f.H * sc) / 2;
      light = { x: (e.clientX - rc.left - ox) / sc, y: (e.clientY - rc.top - oy) / sc, k: f.a.k * 1.1 };
      if (!raf) raf = requestAnimationFrame(draw);
    });
  }

  /* ---------- Parts ---------- */
  function metaLine(p, withTopic) {
    return '<div class="meta">' + (withTopic ? '<span class="tag">' + esc(p.topicName) + '</span>' : '') +
      (p.dateObj ? '<span>' + fmtDate(p.dateObj) + '</span>' : '') + '<span>' + p.mins + ' min read</span></div>';
  }
  function card(p) {
    return '<a class="card" href="#post-' + p.slug + '"><div class="thumb">' + renderPostVisual(p) + '</div>' +
      metaLine(p, true) + '<h3>' + esc(p.title) + '</h3>' + (p.deck ? '<p>' + esc(p.deck) + '</p>' : '') + '</a>';
  }
  function row(p) {
    return '<a class="row" href="#post-' + p.slug + '"><div class="thumb">' + renderPostVisual(p) + '</div>' +
      '<div class="row-body">' + metaLine(p, true) + '<h3>' + esc(p.title) + '</h3>' + (p.deck ? '<p>' + esc(p.deck) + '</p>' : '') + '</div></a>';
  }
  /* Newsletter sign-up. The form on this page sends the address to Kit in the background and then
     swaps itself for a thank-you message. Site settings hold the address of the Kit form, taken
     from Kit's HTML embed (https://app.kit.com/forms/NUMBER/subscriptions). The settings field
     also accepts the whole pasted HTML, or just the form number. Empty hides the sign-up. */
  function newsEndpoint() {
    const raw = String(SITE.newsletter_form || '').trim();
    const m = raw.match(/https:\/\/[\w.-]+\.(?:kit|convertkit)\.com\/forms\/\d+\/subscriptions/i);
    if (m) return m[0];
    return /^\d{3,}$/.test(raw) ? 'https://app.kit.com/forms/' + raw + '/subscriptions' : '';
  }
  /* This browser remembers that its visitor has joined, so later visits show the thank-you
     instead of the form. Only a yes/no flag is kept, never the address. */
  const SUB_KEY = 'low-light-subscribed';
  function isSubscribed() { try { return localStorage.getItem(SUB_KEY) === '1'; } catch (e) { return false; } }
  function rememberSubscribed(on) { try { if (on) localStorage.setItem(SUB_KEY, '1'); else localStorage.removeItem(SUB_KEY); } catch (e) {} }
  function thanksHtml(justJoined) {
    const title = SITE.newsletter_thanks_title || 'Thank you for subscribing.';
    const text = justJoined
      ? (SITE.newsletter_thanks_text || 'Check your inbox for a confirmation email and tap the link inside to finish joining. Not there after a few minutes? Look in your spam folder.')
      : 'You are on the list for ' + SITE.newsletter_name + '. If you have not confirmed yet, check your inbox for the confirmation email.';
    return '<div class="thanks" role="status" tabindex="-1"><h3>' + esc(title) + '</h3><p>' + esc(text) + '</p>' +
      '<button class="btn btn-ghost btn-small" type="button" data-sub-reset>Use a different email</button></div>';
  }
  function joinForm(id) {
    return '<form class="sub" data-subscribe novalidate>' +
      '<div class="field"><label class="sr-only" for="' + id + '">Email address</label>' +
      '<input id="' + id + '" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>' +
      '<button class="btn" type="submit">Join the list</button></div>' +
      '<p class="form-msg" role="status" aria-live="polite"></p></form>';
  }
  function subscribeForm(id) {
    return '<div class="sub-slot" data-id="' + id + '">' + (isSubscribed() ? thanksHtml(false) : joinForm(id)) + '</div>';
  }
  function newsBand() {
    if (!newsEndpoint()) return '';
    return '<section class="band band-news"><div class="wrap news-grid"><div>' +
      '<p class="kicker"><b>' + esc(SITE.newsletter_name) + '</b></p>' +
      '<h2 class="h-section" style="margin-top:.6rem">' + esc(SITE.newsletter_heading) + '</h2>' +
      (SITE.newsletter_text ? '<p>' + esc(SITE.newsletter_text) + '</p>' : '') + '</div>' +
      '<div>' + subscribeForm('sub-band-email') + '</div></div></section>';
  }
  function emptyState(title, text) {
    return '<div class="empty"><h3>' + esc(title) + '</h3><p>' + esc(text) + '</p></div>';
  }

  /* Small helpers for the optional fields. Each returns an empty string when its field is empty,
     so an entry without tags, sources or an update date renders exactly as before. */
  function extAttrs(url) { return /^https?:/i.test(url) ? ' target="_blank" rel="noopener me"' : ' rel="me"'; }
  function hostOf(url) { try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }
  function updatedHtml(p) {
    return p.updatedObj && (!p.dateObj || p.updatedObj.getTime() > p.dateObj.getTime())
      ? '<span>Updated ' + fmtDate(p.updatedObj) + '</span>' : '';
  }
  function tagsHtml(p) {
    if (!p.tags.length) return '';
    return '<div class="tags" role="group" aria-label="Tags">' +
      p.tags.map(t => '<a class="chip chip-tag" href="#tag-' + t.id + '">' + esc(t.name) + '</a>').join('') + '</div>';
  }
  function sourcesHtml(p) {
    if (!p.sources.length) return '';
    return '<section class="sources" aria-labelledby="sourcesTitle"><h2 class="kicker" id="sourcesTitle">Sources</h2><ol>' +
      p.sources.map(x => '<li>' + (x.url
        ? '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.title) + '</a><span class="host">' + esc(hostOf(x.url)) + '</span>'
        : esc(x.title)) + '</li>').join('') + '</ol></section>';
  }

  /* ---------- Article gallery ----------
     Built from the gallery fields of an entry. With no pictures it returns an empty string, so entries
     without a gallery render exactly as before. One picture is always shown as a single figure, because
     a slider with one slide has nothing to slide. */
  function galleryHtml(p) {
    const imgs = p.gallery;
    if (!imgs.length) return '';
    const layout = imgs.length === 1 && p.galleryLayout === 'slider' ? 'stack' : p.galleryLayout;
    const slider = layout === 'slider';
    const label = p.galleryTitle || 'Image gallery';

    const fig = (g, i) => '<figure class="gal-fig"' +
      (slider ? ' role="group" aria-roledescription="slide" aria-label="' + (i + 1) + ' of ' + imgs.length + '"' : '') + '>' +
      '<div class="gal-frame"><img src="' + esc(g.src) + '" alt="' + esc(g.alt) + '" data-galimg loading="lazy" decoding="async"></div>' +
      (g.cap ? '<figcaption class="gal-cap">' + esc(g.cap) + '</figcaption>' : '') + '</figure>';

    const tools = slider
      ? '<div class="gal-tools"><span class="slider-count gal-count" aria-hidden="true">1 of ' + imgs.length + '</span>' +
        '<div class="slider-controls">' +
        '<button type="button" class="slider-btn" data-gal="prev" aria-label="Previous image" disabled>' + CHEV_L + '</button>' +
        '<button type="button" class="slider-btn" data-gal="next" aria-label="Next image">' + CHEV_R + '</button>' +
        '</div></div>'
      : '';
    const head = p.galleryTitle || slider
      ? '<div class="gal-head">' + (p.galleryTitle ? '<div class="kicker gal-title">' + esc(p.galleryTitle) + '</div>' : '') + tools + '</div>'
      : '';
    const dots = slider && imgs.length <= 10
      ? '<div class="gal-dots">' + imgs.map((g, i) =>
          '<button type="button" class="gal-dot" data-gal-dot="' + i + '" aria-label="Show image ' + (i + 1) + '"' + (i === 0 ? ' aria-current="true"' : '') + '></button>').join('') + '</div>'
      : '';
    const list = imgs.map(fig).join('');
    const body = slider
      ? '<div class="gal-track" tabindex="0" role="group" aria-label="' + esc(label) + ', use the arrow keys to move between images">' + list + '</div>'
      : '<div class="gal-' + layout + '">' + list + '</div>';

    return '<section class="gallery gal-' + layout + ' r-' + p.galleryRatio + ' fit-' + p.galleryFit + ' pos-' + p.galleryPos + '" data-gallery="' + layout + '" aria-label="' + esc(label) + '"' +
      (slider ? ' aria-roledescription="carousel"' : '') + '>' + head + body + dots + '</section>';
  }

  // Decides where the gallery goes. "before" sits above the text, outside the prose block, so the opening
  // paragraph keeps its larger lead style. The other two positions go inside the text.
  function placeGallery(p, body) {
    const g = galleryHtml(p);
    if (!g) return { before: '', content: body.html };
    if (p.galleryPos === 'before') return { before: g, content: body.html };
    if (p.galleryPos === 'end' || body.intro < 0) return { before: '', content: body.html + g };
    return { before: '', content: body.parts.slice(0, body.intro + 1).join('') + g + body.parts.slice(body.intro + 1).join('') };
  }

  /* ---------- Image slider ----------
     Shows up to eight entries other than the hero, so the two never repeat each other.
     Covers come from renderPostVisual, so an entry with an image shows it and every other entry
     keeps its generated dot-field cover. No stock photos, no third-party image hosts. */
  function slideCard(p) {
    return '<li class="slider-item"><a class="slide" href="#post-' + p.slug + '">' +
      '<div class="thumb">' + renderPostVisual(p) + '</div>' +
      metaLine(p, true) +
      '<h3>' + esc(p.title) + '</h3>' +
      (p.deck ? '<p>' + esc(p.deck) + '</p>' : '') +
      '</a></li>';
  }

  function imageSliderBand(list) {
    list = (list || []).slice(0, 8);
    if (list.length < 2) return '';
    return '<section class="band band-line" aria-labelledby="sliderTitle"><div class="wrap">' +
      '<div class="section-head"><h2 class="h-section" id="sliderTitle">Browse the essays</h2>' +
      '<div class="slider-tools">' +
        '<span class="slider-count" id="sliderCount" aria-hidden="true"></span>' +
        '<div class="slider-controls">' +
          '<button type="button" class="slider-btn" data-slide="prev" aria-label="Previous essays" aria-controls="imageSliderTrack" disabled>' + CHEV_L + '</button>' +
          '<button type="button" class="slider-btn" data-slide="next" aria-label="Next essays" aria-controls="imageSliderTrack">' + CHEV_R + '</button>' +
        '</div></div></div>' +
      '<ul class="slider-track" id="imageSliderTrack" role="list" tabindex="0" aria-labelledby="sliderTitle">' + list.map(slideCard).join('') + '</ul>' +
      '</div></section>';
  }

  /* Wires the buttons, the "1–3 of 6" counter and the disabled states.
     Called after each render, because the markup is rebuilt on every route change. */
  function bindSlider() {
    sliderRefresh = null;
    const track = $('#imageSliderTrack');
    if (!track) return;
    const items = $$('.slider-item', track);
    const prev = $('[data-slide="prev"]');
    const next = $('[data-slide="next"]');
    const count = $('#sliderCount');
    const tools = $('.slider-tools');
    if (!items.length || !prev || !next || !count || !tools) return;
    let raf = 0;

    function geometry() {
      const gap = parseFloat(getComputedStyle(track).columnGap) || 0;
      const step = items[0].getBoundingClientRect().width + gap;
      const inner = track.clientWidth - 12; // the track's own 6px side padding
      const visible = Math.max(1, Math.floor((inner + gap) / step + 0.05));
      return { step: step, visible: visible };
    }

    function update() {
      raf = 0;
      const max = track.scrollWidth - track.clientWidth;
      const scrolls = max > 2;
      tools.hidden = !scrolls;
      if (!scrolls) return;
      const g = geometry();
      const x = track.scrollLeft;
      const atStart = x <= 2, atEnd = x >= max - 2;
      prev.disabled = atStart;
      next.disabled = atEnd;
      let first = atStart ? 0 : atEnd ? items.length - g.visible : Math.round(x / g.step);
      first = Math.max(0, Math.min(first, items.length - g.visible));
      const last = Math.min(items.length, first + g.visible);
      count.textContent = g.visible > 1 ? (first + 1) + '–' + last + ' of ' + items.length : (first + 1) + ' of ' + items.length;
    }

    function page(dir) {
      const g = geometry();
      const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      track.scrollBy({ left: dir * g.step * g.visible, behavior: calm ? 'auto' : 'smooth' });
    }

    prev.addEventListener('click', () => page(-1));
    next.addEventListener('click', () => page(1));
    track.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(update); }, { passive: true });
    sliderRefresh = update;
    update();
  }

  /* Wires every gallery slider on the page: arrows, dots, the "2 of 5" counter, disabled ends and the
     keyboard. One slide is shown at a time, so the current slide is simply the scroll position divided by
     the slide width plus the gap. Rebuilt after each render, like the front page slider. */
  function bindGalleries() {
    galleryRefresh = [];
    $$('[data-gallery="slider"]').forEach(box => {
      const track = $('.gal-track', box);
      const slides = track ? $$('.gal-fig', track) : [];
      const prev = $('[data-gal="prev"]', box);
      const next = $('[data-gal="next"]', box);
      const count = $('.gal-count', box);
      const dots = $$('[data-gal-dot]', box);
      if (!track || slides.length < 2 || !prev || !next) return;
      let raf = 0, current = 0;

      const calm = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      const step = () => (parseFloat(getComputedStyle(track).columnGap) || 0) + slides[0].getBoundingClientRect().width;

      function update() {
        raf = 0;
        current = Math.max(0, Math.min(slides.length - 1, Math.round(track.scrollLeft / (step() || 1))));
        prev.disabled = current === 0;
        next.disabled = current === slides.length - 1;
        if (count) count.textContent = (current + 1) + ' of ' + slides.length;
        dots.forEach((d, i) => { if (i === current) d.setAttribute('aria-current', 'true'); else d.removeAttribute('aria-current'); });
      }
      function go(i) {
        i = Math.max(0, Math.min(slides.length - 1, i));
        track.scrollTo({ left: i * step(), behavior: calm() ? 'auto' : 'smooth' });
      }

      prev.addEventListener('click', () => go(current - 1));
      next.addEventListener('click', () => go(current + 1));
      dots.forEach(d => d.addEventListener('click', () => go(Number(d.getAttribute('data-gal-dot')))));
      track.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(update); }, { passive: true });
      track.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') go(current - 1);
        else if (e.key === 'ArrowRight') go(current + 1);
        else if (e.key === 'Home') go(0);
        else if (e.key === 'End') go(slides.length - 1);
        else return;
        e.preventDefault();
      });
      // On resize the slide width changes, so put the current slide back at the left edge.
      galleryRefresh.push(() => { track.scrollTo({ left: current * step(), behavior: 'auto' }); update(); });
      update();
    });
  }

  /* ---------- Views ---------- */
  function viewHome() {
    if (!POSTS.length) {
      return '<section class="page-head"><div class="wrap"><h1 class="h-page">' + esc(SITE.name) + '</h1>' +
        (SITE.tagline ? '<p class="lede">' + esc(SITE.tagline) + '</p>' : '') +
        '<div style="margin-top:2rem">' + emptyState('No articles yet.', 'Published articles appear here. Add the first one from your dashboard and it shows up on the next page load.') + '</div></div></section>';
    }
    const f = HERO;
    const others = POSTS.filter(p => p !== f);
    const latest = others.slice(0, 4);
    return '<h1 class="sr-only">' + esc(SITE.name + (SITE.tagline ? ', ' + SITE.tagline : '')) + '</h1>' +
      '<section class="hero"><div class="wrap hero-grid">' +
      '<div class="hero-copy">' +
      '<p class="kicker"><b>Featured</b> · ' + esc(f.topicName) + '</p>' +
      '<h2 class="hero-title"><a href="#post-' + f.slug + '">' + esc(f.title) + '</a></h2>' +
      (f.deck ? '<p class="hero-deck">' + esc(f.deck) + '</p>' : '') +
      '<div class="meta">' + (f.authorName ? '<span>' + esc(f.authorName) + '</span>' : '') + (f.dateObj ? '<span>' + fmtDate(f.dateObj) + '</span>' : '') + '<span>' + f.mins + ' min read</span></div>' +
      '<a class="btn" href="#post-' + f.slug + '">Read the essay ' + ARROW + '</a></div>' +
      '<div class="hero-visual" id="lamp">' + coverSVG(f.slug, true) + '<span class="hint" aria-hidden="true">Move the light</span></div>' +
      '</div></section>' +
      '<section class="band band-line"><div class="wrap"><div class="section-head"><h2 class="h-section">Topics</h2></div><div class="topics">' +
      TOPICS.map(t => {
        const n = POSTS.filter(p => p.topicId === t.id).length;
        return '<a class="topic" href="#journal-' + t.id + '"><span class="count">' + plural(n, 'entry', 'entries') + '</span><h3>' + esc(t.name) + '</h3>' + (t.blurb ? '<p>' + esc(t.blurb) + '</p>' : '') + '</a>';
      }).join('') + '</div></div></section>' +
      imageSliderBand(others) +
      (latest.length ? '<section class="band band-line"><div class="wrap"><div class="section-head"><h2 class="h-section">Latest</h2>' +
        '<a class="more" href="#journal">All ' + POSTS.length + ' entries ' + ARROW + '</a></div>' +
        '<div class="grid-2">' + latest.map(card).join('') + '</div></div></section>' : '') +
      newsBand();
  }

  const state = { topic: null, tag: null, q: '', focusSearch: false };

  function filtered() {
    const q = state.q.trim().toLowerCase();
    return POSTS.filter(p => (!state.topic || p.topicId === state.topic) && (!state.tag || p.tags.some(t => t.id === state.tag)) && (!q || p.hay.indexOf(q) !== -1));
  }
  function resultsHtml() {
    const list = filtered();
    if (!list.length) {
      if (!state.q.trim()) return emptyState('Nothing here yet.', 'No articles have been published here yet.');
      return '<div class="empty"><h3>No entries match that search.</h3><p>Nothing in ' +
        (state.topic && topicOf(state.topic) ? esc(topicOf(state.topic).name) : state.tag && tagOf(state.tag) ? 'the “' + esc(tagOf(state.tag).name) + '” tag' : 'the journal') + ' mentions <strong>' + esc(state.q.trim()) +
        '</strong>. Try a shorter word, or clear the search to see everything.</p>' +
        '<button type="button" class="btn btn-ghost" data-clear>Clear search</button></div>';
    }
    return '<p class="count-line">' + plural(list.length, 'entry', 'entries') + ', newest first</p>' + list.map(row).join('');
  }
  function renderResults() { const el = $('#results'); if (el) el.innerHTML = resultsHtml(); }

  function viewJournal(topicId, tagId) {
    state.topic = topicId || null;
    state.tag = tagId || null;
    const t = topicId ? topicOf(topicId) : null;
    const g = tagId ? tagOf(tagId) : null;
    return '<section class="page-head"><div class="wrap">' +
      '<p class="kicker">' + (t ? 'Journal · ' + esc(t.name) : g ? 'Journal · Tag' : 'Journal') + '</p>' +
      '<h1 class="h-page">' + (t ? esc(t.name) : g ? 'Tagged “' + esc(g.name) + '”' : 'Everything we’ve published') + '</h1>' +
      '<p class="lede">' + (t ? esc(t.blurb || plural(POSTS.filter(p => p.topicId === t.id).length, 'entry', 'entries') + ' in this topic.') : g ? plural(g.n, 'entry', 'entries') + ' tagged “' + esc(g.name) + '”.' : plural(POSTS.length, 'entry', 'entries') + ' across ' + plural(TOPICS.length, 'topic', 'topics') + '.') + '</p>' +
      '<div class="tools"><label class="search"><span class="sr-only">Search entries</span>' + SEARCH +
      '<input id="q" type="search" placeholder="Search titles and ideas" autocomplete="off"></label>' +
      '<nav class="chips" aria-label="Filter by topic"><a class="chip" href="#journal"' + (!t && !g ? ' aria-current="page"' : '') + '>All</a>' +
      TOPICS.map(x => '<a class="chip" href="#journal-' + x.id + '"' + (t && t.id === x.id ? ' aria-current="page"' : '') + '>' + esc(x.name) + '</a>').join('') +
      '</nav>' +
      (TAGS.length ? '<nav class="chip-group" aria-label="Filter by tag"><span class="kicker">Tags</span>' +
        TAGS.map(x => '<a class="chip chip-tag" href="#tag-' + x.id + '"' + (g && g.id === x.id ? ' aria-current="page"' : '') + '>' + esc(x.name) + '<span class="n">' + x.n + '</span></a>').join('') + '</nav>' : '') +
      '</div></div></section>' +
      '<section class="wrap" style="padding-bottom:clamp(3rem,6vw,5rem)"><div id="results" aria-live="polite">' + resultsHtml() + '</div></section>' +
      newsBand();
  }

  function viewPost(p) {
    const body = renderBody(p.body);
    const gal = placeGallery(p, body);
    const isEd = p.authorName && p.authorName === SITE.editor_name;
    const role = isEd ? SITE.editor_role : '', bio = isEd ? SITE.editor_bio : '';
    const i = POSTS.indexOf(p);
    const newer = POSTS[i - 1], older = POSTS[i + 1];
    let related = POSTS.filter(x => x !== p && x.topicId === p.topicId);
    POSTS.forEach(x => { if (x !== p && related.indexOf(x) === -1 && related.length < 2) related.push(x); });
    related = related.slice(0, 2);
    const who = p.authorName ? '<div class="by-who"><span class="avatar" aria-hidden="true">' + esc(initials(p.authorName)) + '</span><div><div class="by-name">' + esc(p.authorName) + '</div>' +
      (role ? '<div class="meta"><span>' + esc(role) + '</span></div>' : '') + '</div></div>' : '';
    return '<article>' +
      '<div class="wrap post-head">' +
      '<nav class="crumbs" aria-label="Breadcrumb"><a href="#journal">Journal</a><span aria-hidden="true">/</span><a href="#journal-' + p.topicId + '">' + esc(p.topicName) + '</a></nav>' +
      '<h1 class="post-title">' + esc(p.title) + '</h1>' +
      (p.deck ? '<p class="post-deck">' + esc(p.deck) + '</p>' : '') +
      '<div class="byline">' + who +
      '<div class="meta">' + (p.dateObj ? '<span>' + fmtDate(p.dateObj) + '</span>' : '') + '<span>' + p.mins + ' min read</span>' + updatedHtml(p) + '</div></div>' + tagsHtml(p) +
      '</div>' +
      '<div class="wrap"><div class="thumb post-cover">' + renderPostVisual(p) + '</div></div>' +
      '<div class="wrap post-grid">' +
      '<aside class="toc" aria-label="In this piece">' + (body.heads.length ? '<p class="kicker">In this piece</p>' +
        body.heads.map(h => '<button type="button" data-jump="' + h.id + '">' + esc(h.text) + '</button>').join('') : '') + '</aside>' +
      '<div>' + gal.before + '<div class="prose" id="article">' + gal.content + '</div>' +
      sourcesHtml(p) +
      '<div class="share"><span class="kicker">Share</span><button type="button" class="btn btn-ghost btn-small" data-copylink>Copy link</button></div>' +
      (p.authorName ? '<div class="author-box"><span class="avatar" aria-hidden="true">' + esc(initials(p.authorName)) + '</span><div><div class="by-name">' + esc(p.authorName) + '</div>' +
        (role ? '<div class="meta"><span>' + esc(role) + '</span></div>' : '') + (bio ? '<p>' + esc(bio) + '</p>' : '') + '</div></div>' : '') +
      '<nav class="pn" aria-label="More entries">' +
      (newer ? '<a href="#post-' + newer.slug + '"><span class="kicker">Newer</span><strong>' + esc(newer.title) + '</strong></a>' : '<span></span>') +
      (older ? '<a href="#post-' + older.slug + '"><span class="kicker">Older</span><strong>' + esc(older.title) + '</strong></a>' : '<span></span>') +
      '</nav></div></div></article>' +
      (related.length ? '<section class="band band-line"><div class="wrap"><div class="section-head"><h2 class="h-section">Keep reading</h2></div><div class="grid-2">' + related.map(card).join('') + '</div></div></section>' : '') +
      newsBand();
  }

  function viewAbout() {
    const n = POSTS.filter(p => p.authorName === SITE.editor_name).length;
    const mail = SITE.email;
    return '<section class="page-head"><div class="wrap"><p class="kicker">About</p>' +
      '<h1 class="h-page">' + esc(SITE.about_title) + '</h1>' +
      (SITE.about_intro ? '<p class="lede">' + esc(SITE.about_intro) + '</p>' : '') + '</div></section>' +
      (SITE.principles.length ? '<section class="band band-line"><div class="wrap"><div class="section-head"><h2 class="h-section">How we work</h2></div><div class="principles">' +
        SITE.principles.map(x => '<div><h3>' + esc(x && x.title) + '</h3><p>' + esc(x && x.text) + '</p></div>').join('') + '</div></div></section>' : '') +
      (SITE.editor_name ? '<section class="band band-line"><div class="wrap"><div class="section-head"><h2 class="h-section">The editor</h2></div><div class="people">' +
        '<div class="person"><span class="avatar" aria-hidden="true">' + esc(initials(SITE.editor_name)) + '</span><div><h3>' + esc(SITE.editor_name) + '</h3><div class="meta">' +
        (SITE.editor_role ? '<span>' + esc(SITE.editor_role) + '</span>' : '') + '<span>' + plural(n, 'entry', 'entries') + '</span></div></div>' +
        (SITE.editor_bio ? '<p>' + esc(SITE.editor_bio) + '</p>' : '') + '</div></div></div></section>' : '') +
      (mail ? '<section class="band band-line"><div class="wrap two-col"><h2 class="h-section">Get in touch</h2><div class="body">' +
        (SITE.contact_text ? '<p>' + esc(SITE.contact_text) + '</p>' : '') +
        '<div class="mail"><code>' + esc(mail) + '</code><button type="button" class="btn btn-ghost btn-small" data-copytext="' + esc(mail) + '">Copy address</button></div></div></div></section>' : '') +
      (SITE.social.length ? '<section class="band band-line"><div class="wrap two-col"><h2 class="h-section">Elsewhere</h2><div class="body"><ul class="social">' +
        SITE.social.map(x => '<li><a class="chip" href="' + esc(x.url) + '"' + extAttrs(x.url) + '>' + esc(x.label) + '</a></li>').join('') + '</ul></div></div></section>' : '') +
      '<section class="band band-line"><div class="wrap two-col"><h2 class="h-section">Colophon</h2><div class="body">' +
      '<p>Set in Bricolage Grotesque for headings, Newsreader for reading and JetBrains Mono for details. The cover art on every entry is generated from the entry’s title, so no two are alike.</p></div></div></section>';
  }

  function viewSubscribe() {
    return '<section class="page-head"><div class="wrap"><p class="kicker">Subscribe</p>' +
      '<h1 class="h-page">' + esc(SITE.newsletter_name) + '</h1>' +
      '<p class="lede">' + esc(SITE.newsletter_text || SITE.newsletter_heading) + '</p>' +
      '<div class="sub-page">' + subscribeForm('sub-page-email') + '</div></div></section>' +
      (POSTS.length ? '<section class="band band-line"><div class="wrap"><div class="section-head"><h2 class="h-section">Recent issues</h2></div><div class="grid-2">' + POSTS.slice(0, 2).map(card).join('') + '</div></div></section>' : '');
  }

  function viewMissing() {
    return '<section class="page-head"><div class="wrap"><p class="kicker">404</p>' +
      '<h1 class="h-page">That page is not here.</h1>' +
      '<p class="lede">The link may be old, or the entry may have moved.</p>' +
      '<p style="margin-top:1.5rem;display:flex;gap:.75rem;flex-wrap:wrap"><a class="btn" href="#home">Back to the front page</a><a class="btn btn-ghost" href="#journal">Browse the journal</a></p></div></section>';
  }

  function viewError(err) {
    const local = location.protocol === 'file:';
    const syntax = err && err.name === 'SyntaxError';
    let msg;
    if (local) msg = 'This page was opened as a file on your device, and the browser blocks it from reading the article files. Open it from its web address instead.';
    else if (syntax) msg = 'One of the content files could not be read. If it was edited by hand, look for a missing comma, quote or bracket. Edits made in the dashboard are always valid.';
    else msg = 'The article files did not load. Check your connection and try again.';
    return '<section class="page-head"><div class="wrap"><p class="kicker">Problem</p>' +
      '<h1 class="h-page">The site could not load its articles.</h1>' +
      '<p class="lede">' + esc(msg) + '</p>' +
      '<p style="margin-top:1.5rem"><button type="button" class="btn" data-reload>Try again</button></p>' +
      (err && err.message ? '<p class="count-line" style="margin-top:1.5rem">' + esc(err.message) + '</p>' : '') + '</div></section>';
  }

  function chrome() {
    $('#brandName').textContent = SITE.name;
    $('#subscribeLink').hidden = !newsEndpoint();
    $('#brandLink').setAttribute('aria-label', SITE.name + ', home');
    $('#foot').innerHTML = '<div class="wrap"><div class="foot-grid' + (SITE.social.length ? ' has-social' : '') + '">' +
      '<div><a class="brand" href="#home">' + esc(SITE.name) + '</a>' + (SITE.tagline ? '<p>' + esc(SITE.tagline) + (SITE.editor_name ? ' Edited by ' + esc(SITE.editor_name) + '.' : '') + '</p>' : '') + '</div>' +
      '<div><h2>Read</h2><ul><li><a href="#journal">All entries</a></li>' +
      TOPICS.map(t => '<li><a href="#journal-' + t.id + '">' + esc(t.name) + '</a></li>').join('') + '</ul></div>' +
      '<div><h2>Site</h2><ul><li><a href="#about">About</a></li>' + (newsEndpoint() ? '<li><a href="#subscribe">Subscribe</a></li>' : '') + '</ul></div>' +
      (SITE.social.length ? '<div><h2>Follow</h2><ul>' + SITE.social.map(x => '<li><a href="' + esc(x.url) + '"' + extAttrs(x.url) + '>' + esc(x.label) + '</a></li>').join('') + '</ul></div>' : '') +
      '</div><div class="legal"><span>© ' + new Date().getFullYear() + ' ' + esc(SITE.editor_name || SITE.name) + '</span>' +
      (SITE.email ? '<span>' + esc(SITE.email) + '</span>' : '') + '</div></div>';
  }

  function resolve() {
    const key = (location.hash || '').slice(1) || 'home';
    const name = SITE.name;
    if (key === 'home') return { nav: 'home', title: name, html: viewHome() };
    if (key === 'journal') return { nav: 'journal', title: 'Journal · ' + name, html: viewJournal(null) };
    if (key.indexOf('journal-') === 0) {
      const t = topicOf(key.slice(8));
      if (t) return { nav: 'journal', title: t.name + ' · ' + name, html: viewJournal(t.id) };
    }
    if (key.indexOf('tag-') === 0) {
      const g = tagOf(key.slice(4));
      if (g) return { nav: 'journal', title: g.name + ' · Journal · ' + name, html: viewJournal(null, g.id) };
    }
    if (key === 'about') return { nav: 'about', title: 'About · ' + name, html: viewAbout() };
    if (key === 'subscribe' && newsEndpoint()) return { nav: 'subscribe', title: 'Subscribe · ' + name, html: viewSubscribe() };
    if (key.indexOf('post-') === 0) {
      const p = POSTS.find(x => x.slug === key.slice(5));
      if (p) return { nav: 'journal', title: p.title + ' · ' + name, html: viewPost(p), post: true };
    }
    return { nav: '', title: 'Not found · ' + name, html: viewMissing() };
  }

  function render(initial) {
    state.q = '';
    const r = resolve();
    $('#main').innerHTML = r.html;
    document.title = r.title;
    $$('[data-nav]').forEach(a => {
      if (a.dataset.nav === r.nav) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    $('#progress').hidden = !r.post;
    if (!initial) window.scrollTo(0, 0);
    const lamp = $('#lamp');
    if (lamp && HERO) bindLamp(lamp, HERO.slug);
    bindSlider();
    bindGalleries();
    if (!initial) {
      const h = $('#main h1');
      if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
    }
    if (state.focusSearch) {
      state.focusSearch = false;
      const q = $('#q');
      if (q) q.focus();
    }
    updateProgress();
  }

  let ticking = false;
  function updateProgress() {
    const art = $('#article');
    const bar = $('#progress span');
    if (!art) { if (bar) bar.style.transform = 'scaleX(0)'; return; }
    const rect = art.getBoundingClientRect();
    const total = Math.max(rect.height - window.innerHeight * 0.6, 1);
    const done = Math.min(1, Math.max(0, (80 - rect.top) / total));
    bar.style.transform = 'scaleX(' + done.toFixed(3) + ')';
    let cur = null;
    $$('h2', art).forEach(h => { if (h.getBoundingClientRect().top < 150) cur = h.id; });
    $$('.toc button').forEach(b => b.classList.toggle('on', b.dataset.jump === cur));
  }
  window.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { ticking = false; updateProgress(); });
  }, { passive: true });
  window.addEventListener('resize', () => { updateProgress(); if (sliderRefresh) sliderRefresh(); galleryRefresh.forEach(f => f()); });

  function legacyCopy(text) {
    const t = document.createElement('textarea');
    t.value = text; t.setAttribute('readonly', '');
    t.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(t); t.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    t.remove();
    return ok;
  }
  function copyText(text, btn) {
    if (!btn.dataset.idle) btn.dataset.idle = btn.textContent;
    const flash = msg => {
      btn.textContent = msg;
      clearTimeout(btn._t);
      btn._t = setTimeout(() => { btn.textContent = btn.dataset.idle; }, 1800);
    };
    const fallback = () => flash(legacyCopy(text) ? 'Copied' : 'Copy failed');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => flash('Copied'), fallback);
    } else { fallback(); }
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('button, [data-jump]');
    if (!t) return;
    if (t.id === 'searchBtn') {
      if (!READY) return;
      const q = $('#q');
      if (q) { q.focus(); q.scrollIntoView({ block: 'center' }); }
      else { state.focusSearch = true; location.hash = 'journal'; }
    } else if (t.id === 'skip') {
      const h = $('#main h1');
      if (h) { h.setAttribute('tabindex', '-1'); h.focus(); }
    } else if (t.hasAttribute('data-reload')) {
      location.reload();
    } else if (t.hasAttribute('data-jump')) {
      const el = document.getElementById(t.dataset.jump);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else if (t.hasAttribute('data-copy')) {
      copyText(t.closest('.code').querySelector('code').textContent, t);
    } else if (t.hasAttribute('data-copylink')) {
      copyText(location.href, t);
    } else if (t.hasAttribute('data-copytext')) {
      copyText(t.dataset.copytext, t);
    } else if (t.hasAttribute('data-clear')) {
      state.q = '';
      const q = $('#q'); if (q) { q.value = ''; q.focus(); }
      renderResults();
    }
  });

  document.addEventListener('input', e => {
    if (e.target.id === 'q') { state.q = e.target.value; renderResults(); }
  });

  /* Sign-up. The request goes to Kit with mode "no-cors": Kit's form address accepts a plain form
     post from any site, but browsers hide its reply, so the page can only tell that the request
     was delivered, not what Kit decided. A network failure is reported; a rejection by Kit is not. */
  document.addEventListener('submit', async e => {
    const form = e.target.closest('form[data-subscribe]');
    if (!form) return;
    e.preventDefault();
    if (form.dataset.busy) return;
    const input = $('input[type="email"]', form);
    const msg = $('.form-msg', form);
    const btn = $('button[type="submit"]', form);
    const problem = text => {
      input.setAttribute('aria-invalid', 'true');
      msg.className = 'form-msg err';
      msg.textContent = text;
      input.focus();
    };
    const email = input.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return problem('Enter a valid email address.');
    const endpoint = newsEndpoint();
    if (!endpoint) return problem('Sign-up is not available right now. Please try again later.');
    input.removeAttribute('aria-invalid');
    msg.className = 'form-msg';
    msg.textContent = '';
    form.dataset.busy = '1';
    const label = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Joining…';
    try {
      await fetch(endpoint, { method: 'POST', mode: 'no-cors', body: new URLSearchParams({ email_address: email }) });
    } catch (err) {
      delete form.dataset.busy;
      btn.disabled = false;
      btn.textContent = label;
      problem('We could not reach the sign-up service. Check your connection and try again.');
      return;
    }
    rememberSubscribed(true);
    const slot = form.closest('.sub-slot');
    if (!slot) return;
    slot.innerHTML = thanksHtml(true);
    const t = $('.thanks', slot);
    if (t) t.focus({ preventScroll: true });
  });

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-sub-reset]');
    if (!b) return;
    rememberSubscribed(false);
    const slot = b.closest('.sub-slot');
    if (!slot) return;
    slot.innerHTML = joinForm(slot.dataset.id);
    const i = $('input[type="email"]', slot);
    if (i) i.focus();
  });

  /* A cover image that fails to load falls back to the entry's generated dot field,
     so a wrong path or a blocked host never leaves an empty box. A gallery picture that fails
     shows a short note in its frame instead of a broken-image icon. Image errors do not
     bubble, so this listens in the capture phase. */
  document.addEventListener('error', e => {
    const img = e.target;
    if (!img || img.tagName !== 'IMG') return;
    if (img.hasAttribute('data-galimg')) {
      const frame = img.parentElement;
      if (frame) frame.innerHTML = '<span class="gal-miss">This image could not be loaded.</span>';
      return;
    }
    if (!img.dataset.slug) return;
    const wrap = img.parentElement;
    if (wrap) wrap.innerHTML = coverSVG(img.dataset.slug);
  }, true);

  window.addEventListener('hashchange', () => { if (READY) render(false); });

  Promise.all([getJSON('site.json', true), getJSON('posts.json', false)]).then(res => {
    prepare(res[0], res[1]);
    READY = true;
    chrome();
    render(true);
  }).catch(err => {
    $('#main').innerHTML = viewError(err);
    document.title = 'Problem loading · Low Light';
  });
})();
</script>
</body>
</html>
